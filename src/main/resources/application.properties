spring.application.name=library-management

# Database Connection
spring.datasource.url=jdbc:mariadb://localhost:3306/library_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate Configuration
# Đổi từ 'validate' sang 'update' để Hibernate tự động tạo bảng cho bạn
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Encoding Configuration
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.force-response=true

# Error Handling
spring.web.error.include-message=always
spring.security.user.name=admin
spring.security.user.password=123456
# Cấu hình kích thước file tối đa (tránh lỗi khi upload ảnh quá nặng)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Đường dẫn thư mục lưu trữ ảnh (Nhi có thể sửa lại theo đường dẫn máy mình)
app.upload.dir=src/main/resources/static/uploads/books/
