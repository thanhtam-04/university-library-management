<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ======= TÌM KIẾM NÂNG CAO =======
     Dùng: th:replace="~{fragments/features :: search-advanced}"
-->
<section th:fragment="search-advanced"
         class="py-10 bg-white border-b border-blue-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Tiêu đề -->
        <div class="text-center mb-8 animate-fade-up">
            <div class="section-eyebrow justify-center mb-3">Tìm kiếm thông minh</div>
            <h2 class="font-display text-2xl font-bold text-navy-900">
                Bộ lọc tìm kiếm nâng cao
            </h2>
            <p class="text-slate-500 text-sm mt-2">
                Lọc chính xác theo tên sách, tác giả, chuyên ngành và nhiều tiêu chí khác
            </p>
        </div>

        <!-- Form tìm kiếm nâng cao -->
        <form th:action="@{/search}" method="get"
              class="bg-gradient-to-br from-blue-50 to-white
                     border border-blue-100 rounded-2xl p-6 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">

                <!-- Tên sách -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
                        Tên sách / ISBN
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                        </div>
                        <input type="text" name="title"
                               placeholder="Nhập tên sách..."
                               class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-blue-100
                                      bg-white text-sm text-navy-900 placeholder-slate-400
                                      focus:border-blue-400 transition-all">
                    </div>
                </div>

                <!-- Tác giả -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
                        Tác giả
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" name="author"
                               placeholder="Tên tác giả..."
                               class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-blue-100
                                      bg-white text-sm text-navy-900 placeholder-slate-400
                                      focus:border-blue-400 transition-all">
                    </div>
                </div>

                <!-- Chuyên ngành / Danh mục -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
                        Chuyên ngành
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                            </svg>
                        </div>
                        <select name="category"
                                class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-blue-100
                                       bg-white text-sm text-navy-900
                                       focus:border-blue-400 transition-all appearance-none">
                            <option value="">-- Tất cả --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">Danh mục</option>
                            <!-- Dữ liệu mẫu khi chưa có backend -->
                            <option value="cntt">Công nghệ thông tin</option>
                            <option value="kinh-te">Kinh tế</option>
                            <option value="luat">Luật</option>
                            <option value="toan">Toán học</option>
                            <option value="van-hoc">Văn học</option>
                        </select>
                    </div>
                </div>

                <!-- Trạng thái -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
                        Trạng thái
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <select name="status"
                                class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-blue-100
                                       bg-white text-sm text-navy-900
                                       focus:border-blue-400 transition-all appearance-none">
                            <option value="">-- Tất cả --</option>
                            <option value="available">Còn sách</option>
                            <option value="unavailable">Hết sách</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Nút tìm kiếm -->
            <div class="flex items-center justify-between gap-4">
                <!-- Tags gợi ý tìm nhanh -->
                <div class="flex flex-wrap gap-2">
                    <span class="text-xs font-medium text-slate-500 self-center">Gợi ý:</span>
                    <a th:href="@{/search(title='Kinh tế vĩ mô')}"
                       class="tag hover:bg-blue-600 hover:text-white transition-colors cursor-pointer text-xs">
                        Kinh tế vĩ mô
                    </a>
                    <a th:href="@{/search(title='Lập trình Java')}"
                       class="tag hover:bg-blue-600 hover:text-white transition-colors cursor-pointer text-xs">
                        Lập trình Java
                    </a>
                    <a th:href="@{/search(title='Luật dân sự')}"
                       class="tag hover:bg-blue-600 hover:text-white transition-colors cursor-pointer text-xs">
                        Luật dân sự
                    </a>
                    <a th:href="@{/search(title='Marketing căn bản')}"
                       class="tag hover:bg-blue-600 hover:text-white transition-colors cursor-pointer text-xs">
                        Marketing căn bản
                    </a>
                </div>
                <div class="flex gap-3 flex-shrink-0">
                    <a th:href="@{/search}" class="btn-outline !py-2.5 !text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Xóa lọc
                    </a>
                    <button type="submit" class="btn-primary !py-2.5 !text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        Tìm kiếm
                    </button>
                </div>
            </div>
        </form>
    </div>
</section>

</body>
</html>
