<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}" lang="vi">
<head>
    <title>Thêm Tài Liệu Số</title>
    <th:block layout:fragment="css">
        <style>
            .form-grid { 
                display: grid; 
                grid-template-columns: 1fr 320px; 
                gap: 24px; 
                margin-top: 20px; 
            }
            @media (max-width: 991px) {
                .form-grid { grid-template-columns: 1fr; }
            }
            .f-card { 
                background: #fff; 
                border: none; 
                border-radius: 12px; 
                padding: 24px; 
                margin-bottom: 24px; 
                box-shadow: 0px 0px 20px rgba(1, 41, 112, 0.05);
            }
            .f-label { 
                display: block; 
                font-weight: 600; 
                margin-bottom: 8px; 
                color: #444; 
                font-size: 14px;
            }
            .f-input, .f-select, .f-textarea { 
                width: 100%; 
                padding: 10px 14px; 
                border-radius: 8px; 
                border: 1px solid #ced4da; 
                box-sizing: border-box; 
                font-size: 14px;
                transition: all 0.2s ease-in-out;
            }
            .f-input:focus, .f-select:focus, .f-textarea:focus {
                border-color: #4154f1;
                outline: 0;
                box-shadow: 0 0 0 0.25rem rgba(65, 84, 241, 0.1);
            }
            .f-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
            .btn-submit { 
                background: #4154f1; 
                color: white; 
                padding: 12px 28px; 
                border: none; 
                border-radius: 8px; 
                font-weight: 600;
                font-size: 14px;
                cursor: pointer; 
                transition: all 0.3s;
                box-shadow: 0 4px 10px rgba(65, 84, 241, 0.2);
            }
            .btn-submit:hover { 
                background: #5969fa; 
                transform: translateY(-1px);
            }
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    
    <h2 style="color: #012970; font-weight: 700; font-size: 24px; margin-bottom: 5px;">Thêm Tài Liệu Số</h2>

    <form th:action="@{/admin/digital/save}" th:object="${document}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" />

        <div class="form-grid">
            
            <div>
                <div class="f-card">
                    <div style="margin-bottom: 15px;">
                        <label class="f-label">Tên tài liệu số *</label>
                        <input type="text" th:field="*{title}" class="f-input" placeholder="Nhập tên tài liệu..." required>
                    </div>
                    
                    <div class="f-row-2">
                        <div>
                            <label class="f-label">Tác giả</label>
                            <select th:field="*{author}" class="f-select">
                                <option value="">-- Chọn tác giả --</option>
                                <option th:each="a : ${authors}" th:value="${a.fullName}" th:text="${a.fullName}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="f-label">Năm xuất bản</label>
                            <input type="number" th:field="*{year}" class="f-input" placeholder="2026">
                        </div>
                    </div>

                    <div style="margin-top: 15px;">
                        <label class="f-label">Danh mục / Môn học</label>
                        <select th:field="*{category}" class="f-select">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.name}"></option>
                        </select>
                    </div>

                    <div style="margin-top: 15px;">
                        <label class="f-label">Mô tả tài liệu (Không lưu)</label>
                        <textarea class="f-textarea" rows="4" placeholder="Nhập mô tả ngắn..."></textarea>
                    </div>
                </div>

                <div class="f-card">
                    <label class="f-label">Tệp tin đính kèm</label>
                    <input type="file" name="file" class="f-input">
                </div>

                <button type="submit" class="btn-submit">Lưu tài liệu</button>
            </div>

            <div>
                <div class="f-card">
                    <label class="f-label">Loại định dạng *</label>
                    <select th:field="*{type}" class="f-select" required>
                        <option value="">-- Chọn loại --</option>
                        <option value="giaotrinh">📖 Giáo trình</option>
                        <option value="luanvan">🎓 Luận văn</option>
                        <option value="nckh">🔬 NCKH</option>
                        <option value="dethi">📝 Đề thi</option>
                        <option value="other">📄 Khác</option>
                    </select>
                </div>

                <div class="f-card">
                    <label class="f-label">Hoặc URL tài liệu</label>
                    <input type="url" th:field="*{fileUrl}" class="f-input" placeholder="https://drive.google.com/...">
                </div>
            </div>

        </div>
    </form>

</div>
</body>
</html>
