<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}"
      lang="vi">
<head>
    <title>Cập nhật Tài liệu số</title>
    <th:block layout:fragment="css">
        <style>
            .form-card {
                background: #fff; border-radius: 12px; padding: 30px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: none;
                width: 100%; margin: 20px auto;
            }
            .section-header-blue {
                color: #2563eb; font-weight: 700; font-size: 16px;
                margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;
                display: flex; align-items: center; gap: 8px;
            }
            .form-label { 
                font-weight: 600; color: #012970; 
                margin-bottom: 8px; font-size: 14px; 
            }
            .form-control, .form-select { 
                border-radius: 8px; padding: 10px 15px; border: 1px solid #e2e8f0; 
                font-size: 14px; background-color: #fff;
            }
            .form-control:focus, .form-select:focus { 
                border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); outline: none; 
            }
            
            .btn-update { 
                background: #2563eb; color: #fff; border: none; padding: 10px 35px; 
                border-radius: 8px; font-weight: 600; transition: 0.3s;
            }
            .btn-update:hover { background: #1d4ed8; transform: translateY(-1px); color: #fff; }
            .btn-cancel { 
                background: #64748b; color: #fff; border: none; padding: 10px 25px; 
                border-radius: 8px; font-weight: 500; text-decoration: none;
            }
            .btn-cancel:hover { background: #475569; color: #fff; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="pagetitle">
            <h1 style="color: #012970; font-weight: 700;">Cập nhật Tài liệu số</h1>
        </div>
        
        <div class="form-card">
    <form th:action="@{/admin/digital/save}" th:object="${document}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{fileUrl}">

        <div class="section-header-blue">
            <i class="bi bi-file-earmark-text-fill"></i> Thông tin tài liệu
        </div>
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <label class="form-label">Tên tài liệu <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Tác giả</label>
                <input type="text" th:field="*{author}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Năm xuất bản</label>
                <input type="number" th:field="*{year}" class="form-control">
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <label class="form-label">Loại tài liệu</label>
                <select th:field="*{type}" class="form-select">
                    <option value="giaotrinh">Giáo trình</option>
                    <option value="luanvan">Luận văn</option>
                    <option value="nckh">NCKH</option>
                    <option value="dethi">Đề thi</option>
                </select>
            </div>
            <div class="col-md-8">
                <label class="form-label">Danh mục</label>
                <input type="text" th:field="*{category}" class="form-control">
            </div>
        </div>

        <div class="section-header-blue">
            <i class="bi bi-link-45deg"></i> Tệp tin
        </div>
        
		<div th:if="${currentFile != null and currentFile != ''}" class="mb-3">
		    <label class="form-label text-muted">Tệp hiện tại:</label>
		    <div class="alert alert-info p-2 d-flex align-items-center">
		        <i class="bi bi-file-earmark-text me-2"></i>
		        <a th:href="@{${currentFile}}" target="_blank" class="text-primary text-decoration-underline">
		            Xem tệp cũ đã tải lên
		        </a>
		    </div>
		</div>

        <div class="row g-4 mb-4">
            <div class="col-md-12">
                <input type="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
            <a th:href="@{/admin/digital/list}" class="btn-cancel">Hủy bỏ</a>
            <button type="submit" class="btn-update">
                <i class="bi bi-save2 me-1"></i> Xác nhận cập nhật
            </button>
        </div>
    </form>
</div>
    </div>
</div>
</body>
</html>
