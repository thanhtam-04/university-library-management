<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"

xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

layout:decorate="~{layouts/admin_layout}"

lang="vi">

<head>

<title>Quản lý Đặt chỗ</title>

<th:block layout:fragment="css">

<style>

.bk-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap}

.bk-title{font-family:var(--fh);font-size:23px;font-weight:800;color:var(--t1);letter-spacing:-.5px}

.bk-breadcrumb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--t3);margin-top:4px;list-style:none;padding:0}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}

.m-tile{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shd)}

.m-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--mic,var(--ca-bg));color:var(--mc,var(--ca))}

.m-val{font-family:var(--fh);font-size:28px;font-weight:800;color:var(--t1);line-height:1}

.m-lbl{font-size:12px;color:var(--t2);margin-top:4px;font-weight:500}

.bk-wrap{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--shd)}

.bk-tbl{width:100%;border-collapse:collapse}

.bk-tbl thead th{background:var(--page);padding:11px 18px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--bdr)}

.bk-tbl td{padding:13px 18px;vertical-align:middle}


.status-pill{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;display:inline-block}

.st-pending{background:#fef3c7;color:#92400e}

.st-ready{background:#dcfce7;color:#166534}

.st-completed{background:#eff6ff;color:#2563eb}


.book-thumb{width:36px;height:48px;border-radius:4px;object-fit:cover;background:#eee}

.usr-info{font-size:13px;font-weight:600;color:var(--t1)}

.usr-sub{font-size:11.5px;color:var(--t3)}

.bk-alert{display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:12px;margin-bottom:20px;font-size:13.5px;background:var(--cg-bg);color:#065f46;border:1px solid rgba(16,185,129,.2)}

</style>

</th:block>

</head>



<body>

<div layout:fragment="content">

<div class="bk-head">

<div>

<div class="bk-title">Quản lý Đặt chỗ</div>

<ol class="bk-breadcrumb">

<li><a th:href="@{/admin/dashboard}">Trang chủ</a></li>

<li>Quản lý Đặt chỗ</li>

</ol>

</div>

</div>



<div th:if="${successMsg}" class="bk-alert"><i class="bi bi-check-circle-fill"></i><span th:text="${successMsg}"></span></div>

<div th:if="${errorMsg}" class="bk-alert" style="background:#fef2f2;color:#991b1b;border-color:rgba(239,68,68,.2)">

<i class="bi bi-exclamation-triangle-fill"></i><span th:text="${errorMsg}"></span>

</div>



<div class="metrics">

<div class="m-tile" style="--mc:var(--ac);--mic:var(--ac-bg)">

<div class="m-ic"><i class="bi bi-calendar-check"></i></div>

<div><div class="m-val" th:text="${reservations.size()}">0</div><div class="m-lbl">Tổng đơn đặt</div></div>

</div>

<div class="m-tile" style="--mc:#d97706;--mic:#fffbeb">

<div class="m-ic"><i class="bi bi-clock-history"></i></div>

<div><div class="m-val" th:text="${reservations.?[status == 'PENDING'].size()}">0</div><div class="m-lbl">Đang chờ</div></div>

</div>

<div class="m-tile" style="--mc:#16a34a;--mic:#f0fdf4">

<div class="m-ic"><i class="bi bi-check2-all"></i></div>

<div><div class="m-val" th:text="${reservations.?[status == 'READY'].size()}">0</div><div class="m-lbl">Sẵn sàng</div></div>

</div>

</div>



<div class="bk-wrap">

<table class="bk-tbl">

<thead>

<tr>

<th style="padding-left:22px">Sách</th>

<th>Người đặt</th>

<th>Tồn kho</th>

<th>Trạng thái</th>

<th class="text-end" style="padding-right:22px">Thao tác</th>

</tr>

</thead>

<tbody>

<tr th:each="r : ${reservations}">

<td style="padding-left:22px">

<div class="flex items-center gap-3">

<img class="book-thumb" th:src="${r.book.coverImage}" alt="Cover">

<div>

<div class="usr-info" th:text="${r.book.title}"></div>

<div class="usr-sub" th:text="${'ISBN: ' + r.book.isbn}"></div>

</div>

</div>

</td>

<td>

<div class="usr-info" th:text="${r.member.user.fullName}"></div>

<div class="usr-sub" th:text="${r.member.user.email}"></div>

</td>

<td>

<span th:text="${r.book.availableCopies > 0 ? r.book.availableCopies : 'Hết hàng'}"

th:classappend="${r.book.availableCopies > 0 ? 'text-green-600 font-bold' : 'text-red-500'}"></span>

</td>

<td>

<span class="status-pill"

th:classappend="${r.status == 'PENDING' ? 'st-pending' : (r.status == 'READY' ? 'st-ready' : 'st-completed')}"

th:text="${r.status}"></span>

</td>

<td style="padding-right:22px">

<form th:action="@{'/admin/reservation/update/' + ${r.id}}" method="post" class="flex justify-end gap-2">

<select name="status" class="bg-page border border-bdr rounded-lg px-2 py-1 text-xs">

<option value="PENDING" th:selected="${r.status == 'PENDING'}">Chờ</option>

<option value="READY" th:disabled="${r.book.availableCopies == 0}"

th:selected="${r.status == 'READY'}">Sẵn sàng</option>

<option value="COMPLETED" th:selected="${r.status == 'COMPLETED'}">Đã mượn</option>

</select>

<button type="submit" class="bg-blue-600 text-white rounded-lg px-3 py-1 text-xs hover:bg-blue-700">Lưu</button>

</form>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</body>

</html>
