<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}" 
      lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    
    <th:block layout:fragment="css">
        <style>
            .stat-value {
                font-size: 2.4rem;
                font-weight: 800;
                font-family: var(--fh);
                line-height: 1;
            }
            
            .trend-up { color: #10b981; }
            .trend-down { color: #ef4444; }
            
            .dashboard-card {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .dashboard-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 
                           0 8px 10px -6px rgb(0 0 0 / 0.1);
            }
        </style>
    </th:block>
</head>

<body>

    <div layout:fragment="content">

        <div class="pagetitle">
            <h1><i class="bi bi-speedometer2 me-2"></i>Dashboard</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                    <li class="breadcrumb-item active">Dashboard</li>
                </ol>
            </nav>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-xl-3 col-md-6">
                <div class="s-tile dashboard-card" style="--tile-c: var(--cb)">
                    <div class="s-tile-ic" style="background: var(--cb-bg); color: var(--cb)">
                        <i class="bi bi-book"></i>
                    </div>
                    <div>
                        <div class="stat-value" th:text="${statistics != null ? statistics.totalBooks : 0}">0</div>
                        <div class="s-tile-lbl">Tổng đầu sách</div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="s-tile dashboard-card" style="--tile-c: var(--cg)">
                    <div class="s-tile-ic" style="background: var(--cg-bg); color: var(--cg)">
                        <i class="bi bi-bookmark-check"></i>
                    </div>
                    <div>
                        <div class="stat-value" th:text="${statistics != null ? statistics.availableCopies : 0}">0</div>
                        <div class="s-tile-lbl">Sách sẵn sàng mượn</div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="s-tile dashboard-card" style="--tile-c: var(--ca)">
                    <div class="s-tile-ic" style="background: var(--ca-bg); color: var(--ca)">
                        <i class="bi bi-people"></i>
                    </div>
                    <div>
                        <div class="stat-value" th:text="${statistics != null ? statistics.activeMembers : 0}">0</div>
                        <div class="s-tile-lbl">Bạn đọc hoạt động</div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="s-tile dashboard-card" style="--tile-c: var(--cr)">
                    <div class="s-tile-ic" style="background: var(--cr-bg); color: var(--cr)">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <div>
                        <div class="stat-value" th:text="${statistics != null ? statistics.overdueLoans : 0}">0</div>
                        <div class="s-tile-lbl">Phiếu mượn quá hạn</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="lc">
                    <div class="lc-hd">
                        <i class="bi bi-clock-history text-primary"></i>
                        <span class="lc-title">Phiếu mượn gần đây</span>
                    </div>
                    <div class="lc-body">
                        <table class="lt" th:if="${recentLoans != null and !recentLoans.isEmpty()}">
                            <thead>
                                <tr>
                                    <th>Mã phiếu</th>
                                    <th>Bạn đọc</th>
                                    <th>Sách</th>
                                    <th>Ngày mượn</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="loan : ${recentLoans}">
                                    <td><span class="id-tag" th:text="${loan.loanCode}"></span></td>
                                    <td th:text="${loan.memberName}"></td>
                                    <td th:text="${loan.items != null ? loan.items.size() : 0} + ' sách'"></td>
                                    <td th:text="${loan.loanDate != null ? #temporals.format(loan.loanDate, 'dd/MM/yyyy') : ''}"></td>
                                    <td>
                                        <span class="s-bdg" 
                                              th:classappend="${loan.status == 'ACTIVE'} ? 'bdg-g' : 'bdg-r'"
                                              th:text="${loan.status}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="empty-box" th:if="${recentLoans == null or recentLoans.isEmpty()}">
                            <i class="bi bi-inbox"></i>
                            <h5>Chưa có phiếu mượn nào</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="lc">
                    <div class="lc-hd">
                        <i class="bi bi-graph-up text-success"></i>
                        <span class="lc-title">Sách mượn nhiều nhất</span>
                    </div>
                    <div class="lc-body">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-bar-chart-line fs-1"></i>
                            <p class="mt-3">Đang cập nhật...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
