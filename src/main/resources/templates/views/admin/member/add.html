<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}"
      lang="vi">
<head>
    <title>Thêm Thành Viên Mới</title>
    <th:block layout:fragment="css">
        <style>
            /* Đồng bộ bộ Style từ trang Sách */
            .form-card { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: none; }
            .form-label { font-weight: 600; color: #012970; margin-bottom: 8px; font-size: 14px; }
            .form-control, .form-select { 
                border-radius: 10px; padding: 12px 15px; border: 1px solid #ced4da; 
                font-size: 14px; transition: all 0.2s; 
            }
            .form-control:focus, .form-select:focus { 
                border-color: #4154f1; box-shadow: 0 0 0 4px rgba(65, 84, 241, 0.1); 
            }
            /* Section title đồng bộ phong cách */
            .section-title { 
                font-size: 16px; font-weight: 700; color: #4154f1; 
                margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f6f9ff;
                display: flex; align-items: center; gap: 10px;
            }
            .btn-save { 
                background: #4154f1; color: #fff; border: none; padding: 12px 30px; 
                border-radius: 10px; font-weight: 600; transition: all 0.3s;
            }
            .btn-save:hover { background: #2f43e0; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(65, 84, 241, 0.3); color: #fff; }
            .btn-back { background: #f8f9fa; color: #6c757d; border-radius: 10px; padding: 12px 20px; font-weight: 600; text-decoration: none; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="pagetitle">
        <h1 style="color: #012970; font-weight: 700;">Thêm Thành Viên Mới</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/member/list}">Thành viên</a></li>
                <li class="breadcrumb-item active">Thêm mới</li>
            </ol>
        </nav>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-octagon me-1"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="section">
        <form th:action="@{/admin/member/save}" th:object="${member}" method="post">

            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-person-badge-fill"></i> Liên kết & Định danh
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <label class="form-label">Tài khoản liên kết (Chưa cấp thẻ) <span class="text-danger">*</span></label>
                        <select name="userId" class="form-select" required>
                            <option value="">-- Chọn tài khoản người dùng --</option>
                            <option th:each="u : ${users}" th:value="${u.id}" 
                                    th:text="${u.fullName + ' (' + u.email + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Mã thẻ thư viện <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{cardNumber}" class="form-control" placeholder="Ví dụ: TV2026001" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Mã sinh viên</label>
                        <input type="text" th:field="*{studentCode}" class="form-control" placeholder="Ví dụ: SV221105">
                    </div>
                </div>

                <div class="section-title">
                    <i class="bi bi-calendar-check-fill"></i> Thời hạn & Học tập
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label">Ngày cấp thẻ <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{cardIssuedDate}" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ngày hết hạn <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{cardExpiryDate}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Khoa / Đơn vị</label>
                        <input type="text" th:field="*{department}" class="form-control" placeholder="Khoa Công nghệ thông tin">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Khóa</label>
                        <input type="text" th:field="*{course}" class="form-control" placeholder="K64">
                    </div>
                </div>

                <div class="section-title">
                    <i class="bi bi-gear-fill"></i> Cài đặt mượn trả
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Giới hạn mượn mặc định (cuốn) *</label>
                        <input type="number" th:field="*{maxBorrowLimit}" class="form-control" min="1" value="5" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Trạng thái thẻ mặc định</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="ACTIVE">Đang hoạt động</option>
                            <option value="SUSPENDED">Tạm khóa</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/member/list}" class="btn-back">
                        <i class="bi bi-arrow-left"></i> Quay lại danh sách
                    </a>
                    <button type="submit" class="btn-save">
                        <i class="bi bi-check-lg"></i> Xác nhận tạo thẻ
                    </button>
                </div>
            </div>
        </form>
    </section>
</div>

<th:block layout:fragment="script">
    <script>
        // Tự động điền ngày cấp thẻ là ngày hôm nay, ngày hết hạn là 4 năm sau cho Nhi tiện làm việc nhé
        document.addEventListener("DOMContentLoaded", function() {
            let issuedInput = document.querySelector("input[name='cardIssuedDate']");
            let expiryInput = document.querySelector("input[name='cardExpiryDate']");
            
            if(!issuedInput.value) {
                let today = new Date().toISOString().split('T')[0];
                issuedInput.value = today;
                
                let next4Years = new Date();
                next4Years.setFullYear(next4Years.getFullYear() + 4);
                expiryInput.value = next4Years.toISOString().split('T')[0];
            }
        });
    </script>
</th:block>
</body>
</html>
