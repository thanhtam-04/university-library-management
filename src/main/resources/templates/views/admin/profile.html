<div layout:fragment="content">
    <div class="bk-head">
        <div class="bk-title">Hồ sơ cá nhân</div>
    </div>

    <form th:action="@{/admin/profile/update}" method="post" th:object="${user}">
        <input type="hidden" th:field="*{id}">
        
        <div class="bk-wrap p-4">
            <div class="row">
                <div class="col-md-6">
                    <label>Họ và Tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                </div>
            </div>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            </div>
        </div>
    </form>
</div>
