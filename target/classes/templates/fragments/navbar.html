<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ======= NAVBAR FRAGMENT =======
     Dùng: th:replace="~{fragments/navbar :: navbar}"
     Truyền: activePage = 'home' | 'category' | 'digital' | 'rules' | 'account'
-->
<header th:fragment="navbar" class="sticky top-0 z-50 bg-white shadow-nav border-b border-blue-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-4">

            <!-- ── Logo ── -->
            <a th:href="@{/}" class="flex items-center gap-3 flex-shrink-0 group">
                <div class="w-9 h-9 rounded-xl flex items-center justify-content-center"
                     style="background:linear-gradient(135deg,#1e3a8a,#2563eb);">
                    <svg class="w-5 h-5 text-white mx-auto" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="hidden sm:block">
                    <div class="font-display text-navy-900 font-bold text-[17px] leading-tight">
                        Thư Viện <span class="text-blue-600">Đại Học</span>
                    </div>
                    <div class="text-[10px] text-slate-400 font-medium tracking-wide uppercase leading-tight">
                        ĐH Kinh tế Nghệ An
                    </div>
                </div>
            </a>

            <!-- ── Thanh tìm kiếm trung tâm ── -->
            <form th:action="@{/search}" method="get"
                  class="flex-1 max-w-xl mx-4 hidden md:flex">
                <div class="relative w-full group">
                    <!-- Icon tìm kiếm -->
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <input type="text" name="q"
                           placeholder="Tìm tên sách, tác giả, ISBN..."
                           class="w-full pl-10 pr-28 py-2.5 rounded-xl
                                  border border-blue-100 bg-blue-50/60
                                  text-[14px] text-navy-900 placeholder-slate-400
                                  focus:bg-white focus:border-blue-400
                                  transition-all duration-200">
                    <button type="submit"
                            class="absolute right-2 top-1/2 -translate-y-1/2
                                   btn-primary !py-1.5 !px-4 !text-[13px] !rounded-lg">
                        Tìm kiếm
                    </button>
                </div>
            </form>

            <!-- ── Menu điều hướng ── -->
            <nav class="hidden lg:flex items-center gap-1">
                <a th:href="@{/}"
                   th:classappend="${activePage == 'home'} ? ' bg-blue-50 text-blue-700 font-semibold'"
                   class="px-3 py-2 rounded-lg text-[13.5px] font-medium text-slate-600
                          hover:bg-blue-50 hover:text-blue-700 transition-all duration-150">
                    Trang chủ
                </a>
                <a th:href="@{/category}"
                   th:classappend="${activePage == 'category'} ? ' bg-blue-50 text-blue-700 font-semibold'"
                   class="px-3 py-2 rounded-lg text-[13.5px] font-medium text-slate-600
                          hover:bg-blue-50 hover:text-blue-700 transition-all duration-150">
                    Danh mục
                </a>
                <a th:href="@{/digital}"
                   th:classappend="${activePage == 'digital'} ? ' bg-blue-50 text-blue-700 font-semibold'"
                   class="px-3 py-2 rounded-lg text-[13.5px] font-medium text-slate-600
                          hover:bg-blue-50 hover:text-blue-700 transition-all duration-150">
                    Tài liệu số
                </a>
                <a th:href="@{/rules}"
                   th:classappend="${activePage == 'rules'} ? ' bg-blue-50 text-blue-700 font-semibold'"
                   class="px-3 py-2 rounded-lg text-[13.5px] font-medium text-slate-600
                          hover:bg-blue-50 hover:text-blue-700 transition-all duration-150">
                    Quy định
                </a>
            </nav>

            <!-- ── Tài khoản ── -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Khi chưa đăng nhập -->
                <div th:if="${#authorization.expression('!isAuthenticated()')}"
                     class="flex items-center gap-2">
                    <a th:href="@{/login}" class="btn-outline !py-2 !px-4 !text-[13px]">
                        Đăng nhập
                    </a>
                    <a th:href="@{/register}"
                       class="btn-primary !py-2 !px-4 !text-[13px] hidden sm:inline-flex">
                        Đăng ký
                    </a>
                </div>

                <!-- Khi đã đăng nhập -->
                <div th:if="${#authorization.expression('isAuthenticated()')}"
                     class="relative group">
                    <button class="flex items-center gap-2 px-3 py-2 rounded-xl
                                   hover:bg-blue-50 transition-all duration-150">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-blue-800
                                    flex items-center justify-content-center text-white text-sm font-bold">
                            <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                        </div>
                        <span class="text-[13px] font-medium text-navy-800 hidden sm:block"
                              th:text="${#authentication.name}">User</span>
                        <svg class="w-3 h-3 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/>
                        </svg>
                    </button>
                    <!-- Dropdown -->
                    <div class="absolute right-0 top-full mt-2 w-48
                                bg-white rounded-xl border border-slate-100
                                shadow-xl opacity-0 invisible
                                group-hover:opacity-100 group-hover:visible
                                transition-all duration-200 z-50">
                        <div class="py-1">
                            <a th:href="@{/profile}"
                               class="flex items-center gap-2.5 px-4 py-2.5 text-[13px]
                                      text-slate-600 hover:bg-blue-50 hover:text-blue-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                Tài khoản cá nhân
                            </a>
                            <a th:href="@{/my-loans}"
                               class="flex items-center gap-2.5 px-4 py-2.5 text-[13px]
                                      text-slate-600 hover:bg-blue-50 hover:text-blue-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                Sách đang mượn
                            </a>
                            <hr class="my-1 border-slate-100">
                            <a th:href="@{/logout}"
                               class="flex items-center gap-2.5 px-4 py-2.5 text-[13px]
                                      text-red-500 hover:bg-red-50">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                                </svg>
                                Đăng xuất
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Hamburger mobile -->
                <button id="mobileMenuBtn"
                        class="lg:hidden p-2 rounded-lg hover:bg-blue-50 transition-colors">
                    <svg class="w-5 h-5 text-navy-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ── Mobile search ── -->
        <div class="md:hidden pb-3">
            <form th:action="@{/search}" method="get" class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input type="text" name="q" placeholder="Tìm sách..."
                       class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-blue-100
                              bg-blue-50/60 text-sm text-navy-900 placeholder-slate-400
                              focus:bg-white focus:border-blue-400 transition-all">
            </form>
        </div>

        <!-- ── Mobile menu ── -->
        <div id="mobileMenu" class="lg:hidden hidden pb-3 border-t border-slate-100 pt-3">
            <nav class="flex flex-col gap-1">
                <a th:href="@{/}" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-700">Trang chủ</a>
                <a th:href="@{/category}" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-700">Danh mục</a>
                <a th:href="@{/digital}" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-700">Tài liệu số</a>
                <a th:href="@{/rules}" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-700">Quy định</a>
            </nav>
        </div>
    </div>

    <script>
        // Toggle mobile menu
        document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        });
    </script>
</header>

</body>
</html>
