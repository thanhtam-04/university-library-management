<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tài khoản cá nhân – LibManage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',
                                500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a',950:'#0f2057' },
                        gold: { 400:'#fbbf24',500:'#f59e0b',600:'#d97706' },
                    },
                    fontFamily: { display:['"Playfair Display"','serif'], body:['"DM Sans"','sans-serif'] }
                }
            }
        }
    </script>
    <style>
        *,*::before,*::after{box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#f8faff;color:#0c1b3a;-webkit-font-smoothing:antialiased}
        .card{background:#fff;border:1px solid #e2e8f5;border-radius:16px;box-shadow:0 2px 8px rgba(14,30,80,.05)}
        
        /* Cấu hình các nút bấm đồng bộ hệ thống */
        .btn-primary{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:.65rem 1.5rem;border-radius:10px;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:.5rem;border:none;cursor:pointer;transition:all .2s ease}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.2)}
        
        .btn-outline{background:#fff;color:#475569;border:1.5px solid #e2e8f5;padding:.65rem 1.5rem;border-radius:10px;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;transition:all .2s ease}
        .btn-outline:hover{background:#f8faff;border-color:#cbd5e1;color:#1e293b}

        .input-field{width:100%;padding:.7rem 1.1rem;border:1.5px solid #e2e8f5;border-radius:10px;font-size:.925rem;transition:all .2s ease;background:#fff}
        .input-field:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
        .input-field:disabled{background:#f1f5f9;color:#64748b;cursor:not-allowed;border-color:#e2e8f5}
        
		.label {
		    display: block;
		    font-size: .8rem;
		    font-weight: 600;
		    color: #475569;
		    margin-bottom: .5rem;
		    text-transform: uppercase;
		    letter-spacing: 0.05em; /* Đây là giá trị chuẩn của tracking-wider trong Tailwind */
		}
    </style>
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-10">

    <nav class="flex items-center gap-2 text-[13px] text-slate-400 mb-8">
        <a th:href="@{/}" class="hover:text-blue-600 transition-colors">Trang chủ</a> 
        <span>/</span> 
        <span class="text-navy-800 font-medium">Tài khoản cá nhân</span>
    </nav>

    <div th:if="${successMsg}" class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-5 py-4 rounded-xl mb-6 flex items-center gap-3 text-[15px]">
        <i class="fas fa-check-circle text-emerald-500 text-lg"></i>
        <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-xl mb-6 flex items-center gap-3 text-[15px]">
        <i class="fas fa-exclamation-circle text-red-500 text-lg"></i>
        <span th:text="${errorMsg}"></span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-7">

        <div class="lg:col-span-1 space-y-6">
            
            <div class="card p-6 text-center bg-white">
                <div class="relative inline-block mb-4">
                    <div class="w-24 h-24 rounded-full overflow-hidden mx-auto border-4 border-white shadow-md ring-4 ring-blue-100">
                        <div th:unless="${user.avatar != null and !user.avatar.isEmpty()}" 
                             class="w-full h-full flex items-center justify-center text-3xl font-bold text-white select-none"
                             style="background:linear-gradient(135deg,#1d4ed8,#2563eb)">
                            <span th:text="${user.fullName != null ? #strings.substring(user.fullName,0,1).toUpperCase() : 'U'}">U</span>
                        </div>
                        <img th:if="${user.avatar != null and !user.avatar.isEmpty()}" th:src="${user.avatar}" class="w-full h-full object-cover">
                    </div>
                </div>
                <h2 class="font-display font-bold text-navy-900 text-xl" th:text="${user.fullName}">Họ và Tên</h2>
                <p class="text-slate-400 text-sm mt-1" th:text="${'@' + user.username}">@username</p>
            </div>

            <div class="card overflow-hidden bg-white" th:if="${member != null}">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
                    <i class="fas fa-id-card text-blue-600"></i>
                    <span class="text-[15px] font-bold text-navy-900">Thẻ bạn đọc thư viện</span>
                </div>
                <div class="m-5 rounded-2xl p-5 text-white relative overflow-hidden shadow-sm" 
                     style="background:linear-gradient(135deg,#0f2057,#1e40af)">
                    <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/5 rounded-full pointer-events-none"></div>
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <div class="text-[11px] uppercase tracking-widest opacity-60 font-semibold">Họ và tên độc giả</div>
                            <div class="font-bold text-base mt-0.5" th:text="${user.fullName}">Họ và Tên</div>
                        </div>
                        <i class="fas fa-graduation-cap text-white/20 text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-[11px] uppercase tracking-widest opacity-60 font-semibold">Mã số thẻ barcode</div>
                        <div class="font-mono font-bold text-sm tracking-wider mt-0.5" th:text="${member.cardNumber}">LIB-2026-XXXX</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">

            <div class="card bg-white">
                <div class="px-6 py-4.5 border-b border-slate-100 flex justify-between items-center">
                    <span class="font-bold text-[16px] text-navy-900">Thông tin cơ bản</span>
                    <button onclick="toggleEdit()" id="editBtn" class="text-blue-600 text-sm font-semibold hover:text-blue-700 flex items-center gap-1.5 bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
                        <i class="fas fa-edit text-xs"></i> Chỉnh sửa
                    </button>
                </div>
                <form th:action="@{/profile/update}" method="post" class="p-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="label">Họ và tên</label>
                            <input type="text" name="fullName" id="fullName" th:value="${user.fullName}" class="input-field" disabled required>
                        </div>
                        <div>
                            <label class="label">Email liên hệ</label>
                            <input type="email" name="email" id="email" th:value="${user.email}" class="input-field" disabled required>
                        </div>
                        <div class="sm:col-span-2">
                            <div>
                                <label class="label">Số điện thoại</label>
                                <input type="tel" name="phone" id="phone" th:value="${user.phone}" class="input-field" disabled>
                            </div>
                        </div>
                    </div>
                    <div id="formActions" class="hidden mt-6 flex justify-end gap-3 border-t border-slate-50 pt-4">
                        <button type="button" onclick="toggleEdit()" class="btn-outline">Hủy bỏ</button>
                        <button type="submit" class="btn-primary">Lưu thay đổi</button>
                    </div>
                </form>
            </div>

            <div class="card bg-white">
                <div class="px-6 py-4.5 border-b border-slate-100">
                    <span class="font-bold text-[16px] text-navy-900">Đổi mật khẩu bảo mật</span>
                </div>
                <form th:action="@{/profile/change-password}" method="post" class="p-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="label">Mật khẩu hiện tại</label>
                            <input type="password" name="currentPassword" class="input-field" placeholder="••••••••" required>
                        </div>
                        <div>
                            <label class="label">Mật khẩu mới</label>
                            <input type="password" name="newPassword" id="newPwd" class="input-field" placeholder="Tối thiểu 6 ký tự" required>
                        </div>
                        <div>
                            <label class="label">Xác nhận mật khẩu</label>
                            <input type="password" name="confirmPassword" id="confirmPwd" class="input-field" placeholder="Nhập lại mật khẩu mới" required>
                        </div>
                    </div>
                    <div class="flex justify-end mt-6 border-t border-slate-50 pt-4">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-key text-xs opacity-80"></i> Cập nhật mật khẩu
                        </button>
                    </div>
                </form>
            </div>

          
        </div>
    </div>
</div>

<div th:replace="~{navbar :: footer}"></div>

<script>
    function toggleEdit() {
        const fields = document.querySelectorAll('#fullName, #email, #phone');
        const actions = document.getElementById('formActions');
        const btn = document.getElementById('editBtn');
        
        const isDisabled = fields[0].disabled;
        fields.forEach(f => f.disabled = !isDisabled);
        actions.classList.toggle('hidden');
        
        if(isDisabled) {
            btn.innerHTML = '<i class="fas fa-times text-xs"></i> Hủy';
            btn.classList.remove('bg-blue-50', 'text-blue-600');
            btn.classList.add('bg-slate-100', 'text-slate-600');
        } else {
            btn.innerHTML = '<i class="fas fa-edit text-xs"></i> Chỉnh sửa';
            btn.classList.remove('bg-slate-100', 'text-slate-600');
            btn.classList.add('bg-blue-50', 'text-blue-600');
        }
    }
</script>
</body>
</html>
