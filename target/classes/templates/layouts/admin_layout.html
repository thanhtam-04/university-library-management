<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE – LibManage">LibManage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">

    <th:block layout:fragment="css"></th:block>

    <style>
/* ═══════════ TOKENS ═══════════ */
:root {
    --sw: 260px; --hh: 62px;
    --sb: #111827; --sb2: #1b2537;
    --sb-line: rgba(255,255,255,0.07);
    --sb-txt:  #7c8fa6; --sb-ic: #3d4f66;
    --ac: #f59e0b; --ac-dk: #d97706;
    --ac-bg: rgba(245,158,11,0.10);
    --ac-glow: 0 4px 16px rgba(245,158,11,0.28);
    --page: #f3f6fb; --card: #ffffff;
    --bdr: #e8ecf4;
    --shd: 0 1px 4px rgba(17,24,39,.05),0 6px 20px rgba(17,24,39,.04);
    --t1: #111827; --t2: #4b5563; --t3: #9ca3af;
    --cg: #10b981; --cg-bg: rgba(16,185,129,.10);
    --cb: #3b82f6; --cb-bg: rgba(59,130,246,.10);
    --cr: #ef4444; --cr-bg: rgba(239,68,68,.10);
    --ca: #f59e0b; --ca-bg: rgba(245,158,11,.10);
    --cp: #8b5cf6; --cp-bg: rgba(139,92,246,.10);
    --fh: 'Bricolage Grotesque',sans-serif;
    --fb: 'DM Sans',sans-serif;
    --ease: cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--page);color:var(--t1);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ═══════════ HEADER ═══════════ */
#lib-header{
    position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:997;
    display:flex;align-items:center;
    background:#fff;border-bottom:1px solid var(--bdr);
}
.hd-brand{
    width:var(--sw);height:100%;
    background:var(--sb);
    display:flex;align-items:center;
    padding:0 20px;gap:11px;flex-shrink:0;
    border-right:1px solid var(--sb-line);
    text-decoration:none;
}
.brand-ic{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--ac) 0%,#fb923c 100%);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;box-shadow:var(--ac-glow);
}
.brand-ic i{color:#fff;font-size:17px}
.brand-name{font-family:var(--fh);font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;display:block;line-height:1.1}
.brand-sub{font-size:9.5px;color:var(--sb-txt);letter-spacing:.7px;text-transform:uppercase;display:block;margin-top:2px}
.hd-tog{
    width:36px;height:36px;border-radius:9px;
    border:1px solid var(--bdr);background:var(--page);
    color:var(--t2);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;margin-left:18px;flex-shrink:0;
    transition:all .18s var(--ease);
}
.hd-tog:hover{background:var(--ac-bg);color:var(--ac);border-color:var(--ac)}
.hd-search{
    display:flex;align-items:center;gap:8px;
    height:38px;padding:0 14px;margin-left:14px;width:240px;
    border-radius:50px;border:1px solid var(--bdr);background:var(--page);
    transition:all .18s var(--ease);
}
.hd-search:focus-within{background:#fff;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
.hd-search i{color:var(--t3);font-size:13px;flex-shrink:0}
.hd-search input{border:none;background:transparent;outline:none;font-family:var(--fb);font-size:13px;color:var(--t1);width:100%}
.hd-search input::placeholder{color:var(--t3)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:4px;padding-right:20px}
.hd-ico{
    position:relative;width:36px;height:36px;border-radius:9px;
    border:none;background:transparent;color:var(--t2);font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;text-decoration:none;transition:all .15s var(--ease);
}
.hd-ico:hover{background:var(--page);color:var(--ac)}
.hd-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--cr);border-radius:50%;border:2px solid #fff}
.hd-sep{width:1px;height:26px;background:var(--bdr);margin:0 6px}
.hd-prof{
    display:flex;align-items:center;gap:9px;
    padding:5px 10px 5px 5px;border-radius:50px;
    border:1px solid transparent;background:transparent;
    cursor:pointer;text-decoration:none;transition:all .15s var(--ease);
}
.hd-prof:hover{background:var(--page);border-color:var(--bdr)}
.hd-av{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,var(--ac),#fb923c);
    color:#fff;font-size:12px;font-weight:700;font-family:var(--fh);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hd-pn{font-size:13px;font-weight:600;color:var(--t1);font-family:var(--fh);display:block;line-height:1.2}
.hd-pr{font-size:11px;color:var(--t3);display:block}

/* Dropdown */
.dropdown-menu{
    border:1px solid var(--bdr)!important;
    box-shadow:0 16px 48px rgba(17,24,39,.12),0 4px 12px rgba(17,24,39,.06)!important;
    border-radius:14px!important;padding:8px!important;min-width:196px;
    animation:popIn .16s var(--ease);
}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.dropdown-item{
    border-radius:8px;padding:9px 12px;font-size:13.5px;
    font-family:var(--fb);color:var(--t2);
    display:flex;align-items:center;gap:9px;transition:all .13s;
}
.dropdown-item:hover{background:var(--page);color:var(--t1)}
.dropdown-item.text-danger:hover{background:var(--cr-bg);color:var(--cr)!important}
.dropdown-divider{border-color:var(--bdr)!important;margin:5px 8px!important}
.hd-di{padding:8px 12px 4px}
.hd-di strong{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--t1);display:block}
.hd-di small{font-size:11.5px;color:var(--t3)}

/* ═══════════ SIDEBAR ═══════════ */
#lib-sidebar{
    position:fixed;top:var(--hh);left:0;bottom:0;width:var(--sw);
    background:var(--sb);z-index:996;
    overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.05) transparent;
    transition:transform .3s var(--ease);
}
#lib-sidebar::-webkit-scrollbar{width:3px}
#lib-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:4px}
.sb-label{
    font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--sb-ic);padding:18px 20px 5px;font-family:var(--fb);display:block;
}
.sb-nav{list-style:none;padding:6px 0;margin:0}
.sb-item{padding:2px 10px;list-style:none}
.sb-link{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    font-size:13px;font-weight:500;color:var(--sb-txt);
    text-decoration:none;font-family:var(--fb);
    transition:all .16s var(--ease);white-space:nowrap;
}
.sb-link .sb-ic{
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;background:rgba(255,255,255,0.04);color:var(--sb-ic);
    flex-shrink:0;transition:all .16s var(--ease);
}
.sb-link:hover{color:rgba(255,255,255,.80);background:rgba(255,255,255,.05)}
.sb-link:hover .sb-ic{background:rgba(255,255,255,.09);color:rgba(255,255,255,.65)}
.sb-link.active{color:#fff;background:var(--ac-bg)}
.sb-link.active .sb-ic{background:var(--ac);color:var(--sb);box-shadow:0 3px 10px rgba(245,158,11,.40)}
.sb-bdg{
    margin-left:auto;height:17px;min-width:17px;padding:0 5px;
    border-radius:9px;background:var(--cr);color:#fff;
    font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:var(--fb);
}
.sb-foot{padding:14px 10px 18px;margin-top:6px;border-top:1px solid var(--sb-line)}
.sb-status-card{
    background:var(--sb2);border:1px solid var(--sb-line);border-radius:10px;
    padding:11px 13px;display:flex;align-items:center;gap:10px;
}
.sb-dot{
    width:8px;height:8px;border-radius:50%;background:var(--cg);
    box-shadow:0 0 8px var(--cg);flex-shrink:0;
    animation:sbpulse 2.5s ease-in-out infinite;
}
@keyframes sbpulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-status-txt strong{color:rgba(255,255,255,.7);font-weight:500;font-size:12.5px;display:block;font-family:var(--fb)}
.sb-status-txt span{color:var(--sb-txt);font-size:11.5px;font-family:var(--fb)}

/* ═══════════ MAIN & FOOTER ═══════════ */
#lib-main{
    margin-left:var(--sw);margin-top:var(--hh);
    padding:26px 30px;
    min-height:calc(100vh - var(--hh));
    transition:margin-left .3s var(--ease);
}
#lib-footer{
    margin-left:var(--sw);padding:16px 30px;
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--bdr);font-family:var(--fb);
    font-size:12.5px;color:var(--t3);
    transition:margin-left .3s var(--ease);
}

/* ═══════════ PAGETITLE ═══════════ */
.pagetitle{margin-bottom:22px}
.pagetitle h1{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.4px;line-height:1.2}
.breadcrumb{margin:5px 0 0;padding:0;background:none}
.breadcrumb-item{font-size:12.5px;color:var(--t3);font-family:var(--fb)}
.breadcrumb-item a{color:var(--t2);text-decoration:none;transition:color .14s}
.breadcrumb-item a:hover{color:var(--ac)}
.breadcrumb-item.active{color:var(--t2);font-weight:500}
.breadcrumb-item+.breadcrumb-item::before{color:var(--t3)}

/* ═══════════ SHARED UI ═══════════ */
/* Card */
.lc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:var(--shd)}
.lc-hd{padding:15px 22px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.lc-title{font-family:var(--fh);font-size:14.5px;font-weight:700;color:var(--t1)}
.lc-body{padding:22px}

/* Stat tile */
.s-tile{
    background:var(--card);border:1px solid var(--bdr);border-radius:14px;
    padding:18px 20px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--shd);transition:all .2s var(--ease);
    position:relative;overflow:hidden;cursor:default;
}
.s-tile::before{
    content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
    background:var(--tile-c,var(--ac));
    transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease);
}
.s-tile:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(17,24,39,.09)}
.s-tile:hover::before{transform:scaleX(1)}
.s-tile-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.s-tile-val{font-family:var(--fh);font-size:26px;font-weight:800;color:var(--t1);line-height:1}
.s-tile-lbl{font-size:12px;color:var(--t2);margin-top:3px}

/* Table */
.lt{width:100%;border-collapse:collapse;font-family:var(--fb)}
.lt thead th{
    background:var(--page);padding:10px 16px;
    font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--t3);border-bottom:1px solid var(--bdr);white-space:nowrap;
}
.lt tbody tr{border-bottom:1px solid #f1f4fb;transition:background .12s}
.lt tbody tr:last-child{border-bottom:none}
.lt tbody tr:hover{background:#f9fbff}
.lt td{padding:13px 16px;vertical-align:middle;font-size:13.5px;color:var(--t1)}

/* ID tag */
.id-tag{
    display:inline-block;background:var(--page);border:1px solid var(--bdr);
    border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:700;
    font-family:monospace;color:var(--t2);
}

/* Action icons */
.ai{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;text-decoration:none;border:none;cursor:pointer;transition:all .14s var(--ease)}
.ai-edit{background:var(--cb-bg);color:var(--cb)} .ai-edit:hover{background:var(--cb);color:#fff}
.ai-del{background:var(--cr-bg);color:var(--cr)}  .ai-del:hover{background:var(--cr);color:#fff}
.ai-view{background:var(--cp-bg);color:var(--cp)} .ai-view:hover{background:var(--cp);color:#fff}

/* Buttons */
.btn-p{
    background:var(--ac);color:var(--sb);border:none;border-radius:10px;
    padding:9px 20px;font-size:13.5px;font-weight:600;font-family:var(--fb);
    display:inline-flex;align-items:center;gap:7px;
    cursor:pointer;text-decoration:none;
    box-shadow:0 3px 10px rgba(245,158,11,.20);
    transition:all .17s var(--ease);
}
.btn-p:hover{background:var(--ac-dk);transform:translateY(-1px);box-shadow:0 6px 18px rgba(245,158,11,.30);color:var(--sb)}
.btn-g{
    background:transparent;color:var(--t2);border:1px solid var(--bdr);
    border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:500;font-family:var(--fb);
    display:inline-flex;align-items:center;gap:7px;
    cursor:pointer;text-decoration:none;transition:all .17s var(--ease);
}
.btn-g:hover{background:var(--page);color:var(--t1);border-color:#cbd5e1}

/* Search bar */
.s-bar{
    display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;
    border:1.5px solid var(--bdr);border-radius:10px;background:var(--page);
    transition:all .17s var(--ease);
}
.s-bar:focus-within{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac-bg)}
.s-bar i{color:var(--t3);font-size:13.5px;flex-shrink:0}
.s-bar input{border:none;background:transparent;outline:none;font-family:var(--fb);font-size:13.5px;color:var(--t1);width:100%}
.s-bar input::placeholder{color:var(--t3)}

/* Form controls */
.f-label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;letter-spacing:.2px;font-family:var(--fb)}
.f-ctrl{
    width:100%;background:var(--page);border:1.5px solid var(--bdr);border-radius:10px;
    padding:10px 14px;font-family:var(--fb);font-size:13.5px;color:var(--t1);
    transition:all .17s var(--ease);outline:none;appearance:none;
}
.f-ctrl:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac-bg)}
.f-ctrl::placeholder{color:var(--t3)}

/* Status badge */
.s-bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:50px;font-size:11.5px;font-weight:600;font-family:var(--fb)}
.s-bdg::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.bdg-g{background:var(--cg-bg);color:var(--cg)} .bdg-r{background:var(--cr-bg);color:var(--cr)}
.bdg-a{background:var(--ca-bg);color:var(--ca)} .bdg-b{background:var(--cb-bg);color:var(--cb)}
.bdg-p{background:var(--cp-bg);color:var(--cp)}

/* Alert */
.lib-alert{
    display:flex;align-items:flex-start;gap:11px;
    padding:13px 16px;border-radius:10px;font-size:13.5px;font-family:var(--fb);
    margin-bottom:18px;border:1px solid transparent;
}
.lib-alert i{font-size:17px;flex-shrink:0;margin-top:1px}
.lib-alert-ok{background:var(--cg-bg);color:#065f46;border-color:rgba(16,185,129,.2)}
.lib-alert-err{background:var(--cr-bg);color:#991b1b;border-color:rgba(239,68,68,.2)}
.la-close{margin-left:auto;background:none;border:none;cursor:pointer;opacity:.6;font-size:15px;color:inherit}
.la-close:hover{opacity:1}

/* Empty state */
.empty-box{text-align:center;padding:56px 20px}
.empty-box i{font-size:44px;color:var(--bdr);display:block;margin-bottom:14px}
.empty-box h5{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--t2);margin-bottom:5px}
.empty-box p{font-size:13px;color:var(--t3)}

/* Page loader */
.pg-load{position:fixed;inset:0;z-index:9999;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center}
.pg-load.on{display:flex}
.pg-load-box{background:#fff;border-radius:16px;padding:30px 36px;text-align:center;box-shadow:0 24px 60px rgba(17,24,39,.18)}
.pg-spin{width:38px;height:38px;border:3px solid var(--bdr);border-top-color:var(--ac);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.pg-load-txt{font-family:var(--fh);font-size:13.5px;font-weight:600;color:var(--t2)}

/* Toggle state */
body.sb-off #lib-sidebar{transform:translateX(calc(-1 * var(--sw)))}
body.sb-off #lib-main,body.sb-off #lib-footer{margin-left:0}
@media(max-width:1199px){
    #lib-main,#lib-footer{margin-left:0}
    #lib-sidebar{transform:translateX(calc(-1 * var(--sw)))}
    body.sb-off #lib-sidebar{transform:translateX(0)}
}
@media(max-width:768px){.hd-search{display:none}#lib-main{padding:18px 14px}}
    </style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header id="lib-header">
    <a th:href="@{/admin/dashboard}" class="hd-brand">
        <div class="brand-ic"><i class="bi bi-book-half"></i></div>
        <div>
            <span class="brand-name">LibManage</span>
            <span class="brand-sub">Thư Viện Đại Học</span>
        </div>
    </a>

    <button class="hd-tog" id="sbTog" type="button">
        <i class="bi bi-list"></i>
    </button>

    <div class="hd-search">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Tìm kiếm sách, sinh viên...">
    </div>

    <div class="hd-right">
        <a class="hd-ico" href="#"><i class="bi bi-bell"></i><span class="hd-dot"></span></a>
        <a class="hd-ico" href="#"><i class="bi bi-plus-circle"></i></a>
        <span class="hd-sep"></span>
		<div class="dropdown" sec:authorize="isAuthenticated()">
		    <a class="hd-prof dropdown-toggle" href="#" id="hpd"
		       data-bs-toggle="dropdown" aria-expanded="false" style="text-decoration:none">
		        <div class="hd-av" th:text="${#authentication.principal.username.substring(0, 2).toUpperCase()}">UN</div>
		        
		        <div class="d-none d-md-block">
		            <span class="hd-pn" th:text="${#authentication.principal.username}">Username</span>
		            <span class="hd-pr" th:text="${#authentication.principal.authorities[0].authority}">Role</span>
		        </div>
		        <i class="bi bi-chevron-down d-none d-md-inline ms-1" style="font-size:10px;color:var(--t3)"></i>
		    </a>
		    
		    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="hpd">
		        <li><div class="hd-di">
		            <strong th:text="${#authentication.principal.username}">Username</strong>
		           
		        </div></li>
		        <li><hr class="dropdown-divider"></li>
		       
		        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
		    </ul>
		</div>
    </div>
</header>

<!-- ══════════════ SIDEBAR ══════════════ -->
<aside id="lib-sidebar">
    <div th:replace="~{fragments/sidebar :: aside}"></div>
</aside>

<!-- ══════════════ MAIN ══════════════ -->
<main id="lib-main">
    <div layout:fragment="content"></div>
</main>

<!-- ══════════════ FOOTER ══════════════ -->
<footer id="lib-footer">
    <span>&copy; 2026 <strong style="color:var(--t2)">LibManage</strong> – ĐH Kinh tế Nghệ An</span>
    <span style="font-size:11px">Spring Boot 3.2 · v1.0.0</span>
</footer>

<!-- Page loader -->
<div class="pg-load" id="pgLoad">
    <div class="pg-load-box">
        <div class="pg-spin"></div>
        <div class="pg-load-txt">Đang xử lý...</div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
    document.getElementById('sbTog').addEventListener('click',()=>
        document.body.classList.toggle('sb-off'));

    (function(){
        const p=location.pathname;
        document.querySelectorAll('#lib-sidebar .sb-link').forEach(a=>{
            const h=a.getAttribute('href');
            if(h&&h!='/'&&p.startsWith(h)) a.classList.add('active');
        });
    })();

    document.querySelectorAll('form').forEach(f=>
        f.addEventListener('submit',()=>
            document.getElementById('pgLoad').classList.add('on')));

    setTimeout(()=>document.querySelectorAll('.lib-alert').forEach(el=>{
        el.style.transition='opacity .45s,margin .45s';
        el.style.opacity='0'; el.style.marginBottom='0';
        setTimeout(()=>el.remove(),460);
    }),4200);
</script>
<th:block layout:fragment="script"></th:block>
</body>
</html>
