<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối | LibManage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-page: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary: #4f46e5;
            --primary-hover: #3730a3;
            --danger-grad: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        }

        body {
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, rgba(241, 245, 249, 0.5) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(238, 242, 255, 0.8) 0, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Hiệu ứng xuất hiện mượt mà */
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .error-container {
            animation: cardAppear 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 0 0 1px 0 rgba(15, 23, 42, 0.1);
            text-align: center;
            max-width: 520px;
            width: 90%;
            position: relative;
        }

        /* Cải tiến vòng tròn Icon */
        .icon-box {
            width: 100px;
            height: 100px;
            background: var(--danger-grad);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            color: #ffffff;
            font-size: 42px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2);
            animation: pulseGlow 2s infinite;
        }

        .error-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .error-desc {
            font-size: 14.5px;
            color: var(--text-sub);
            line-height: 1.65;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .error-desc strong {
            color: #dc2626;
            background: #fef2f2;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Nút quay lại thiết kế cao cấp */
        .btn-back {
            background-color: var(--primary);
            color: #ffffff !important;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        /* Decoration nhỏ tinh tế phía dưới */
        .brand-footer {
            margin-top: 36px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="icon-box">
        <i class="bi bi-shield-slash-fill"></i>
    </div>
    <div class="error-title">Truy cập bị từ chối</div>
    <div class="error-desc">
        Tài khoản của bạn hiện đang cấu hình vai trò là <strong>Thủ thư</strong>. Theo phân quyền hệ thống, bạn không có thẩm quyền thực hiện thao tác xóa dữ liệu hoặc can thiệp cấu hình nhân sự. Vui lòng liên hệ <strong>Quản trị viên</strong> nếu cần cấp thêm quyền.
    </div>
    <a href="javascript:history.back()" class="btn-back">
        <i class="bi bi-arrow-left-short" style="font-size: 18px;"></i> Quay lại trang trước
    </a>
    
    <div class="brand-footer">
        <i class="bi bi-book-half"></i> LibManage Hệ Thống Thư Viện
    </div>
</div>

</body>
</html>
