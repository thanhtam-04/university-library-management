<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}" lang="vi">
<head>
    <title>Tin nhắn liên hệ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

        :root {
            --accent:       #4f6ef7;
            --accent-soft:  #eef1fe;
            --accent-dark:  #3451d1;
            --amber:        #f59e0b;
            --amber-soft:   #fef3c7;
            --green:        #16a34a;
            --green-soft:   #dcfce7;
            --red:          #dc2626;
            --red-soft:     #fee2e2;
            --t1: #0f172a;
            --t2: #334155;
            --t3: #94a3b8;
            --bdr: #e2e8f0;
            --page: #f1f5f9;
            --card: #ffffff;
            --shd: 0 1px 16px rgba(15,23,42,.07);
            --radius: 18px;
            --font: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Animations ── */
        .anim { opacity: 0; transform: translateY(16px); animation: fadeUp .48s ease forwards; }
        .anim-1 { animation-delay: .04s; }
        .anim-2 { animation-delay: .14s; }
        .anim-3 { animation-delay: .24s; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* ── Page Header ── */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 26px;
        }
        .page-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--t1);
            line-height: 1.2;
        }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            font-size: 13px;
            color: var(--t3);
            margin-top: 4px;
        }
        .breadcrumb li + li::before { content: '/'; margin-right: 6px; opacity: .5; }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* ── Flash ── */
        .flash-success {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: var(--green-soft);
            border: 1px solid #86efac;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #166534;
        }

        /* ── Metrics ── */
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        .metric-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--radius);
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shd);
            position: relative;
            overflow: hidden;
            transition: transform .18s, box-shadow .18s;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(15,23,42,.11);
        }
        .metric-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 80px; height: 80px;
            border-radius: 50%;
            opacity: .06;
            transform: translate(20px, -20px);
        }
        .metric-card.blue::after  { background: var(--accent); }
        .metric-card.amber::after { background: var(--amber); }

        .metric-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .metric-icon.blue  { background: var(--accent-soft); color: var(--accent); }
        .metric-icon.amber { background: var(--amber-soft);  color: #b45309; }

        .metric-val {
            font-size: 30px;
            font-weight: 800;
            color: var(--t1);
            font-family: var(--mono);
            line-height: 1;
        }
        .metric-lbl {
            font-size: 12px;
            color: var(--t3);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-top: 4px;
        }

        /* ── Main Card ── */
        .main-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shd);
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--bdr);
            background: #fafbff;
        }
        .toolbar-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--t1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-title .bi { color: var(--accent); }
        .search-wrap {
            flex: 1;
            position: relative;
            max-width: 340px;
            margin-left: auto;
        }
        .search-wrap .bi {
            position: absolute;
            left: 11px; top: 50%;
            transform: translateY(-50%);
            color: var(--t3);
            font-size: 14px;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 8px 14px 8px 34px;
            border-radius: 10px;
            border: 1px solid var(--bdr);
            background: var(--card);
            font-size: 13px;
            font-family: var(--font);
            color: var(--t1);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79,110,247,.12);
        }
        .search-input::placeholder { color: var(--t3); }

        /* ── Table ── */
        .ct-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .ct-tbl col.c-sender  { width: 17%; }
        .ct-tbl col.c-subject { width: 26%; }
        .ct-tbl col.c-contact { width: 17%; }
        .ct-tbl col.c-status  { width: 11%; }
        .ct-tbl col.c-reply   { width: 13%; }
        .ct-tbl col.c-action  { width: 16%; }

        .ct-tbl thead th {
            padding: 10px 18px;
            font-size: 11px;
            font-weight: 700;
            color: var(--t3);
            text-transform: uppercase;
            letter-spacing: .6px;
            border-bottom: 1px solid var(--bdr);
            background: #fafbff;
            text-align: left;
        }
        .ct-tbl thead th:last-child { text-align: right; }

        .ct-tbl td {
            padding: 15px 18px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
            font-size: 13.5px;
            color: var(--t2);
        }
        .ct-tbl tbody tr:last-child td { border-bottom: none; }
        .ct-tbl tbody tr { transition: background .12s; }
        .ct-tbl tbody tr:hover { background: #f8f9ff; }
        .ct-tbl tbody tr.row-unread { background: #fffbeb; }
        .ct-tbl tbody tr.row-unread:hover { background: #fef9ec; }

        /* ── Row content ── */
        .sender-name  { font-weight: 700; color: var(--t1); margin-bottom: 3px; }
        .sender-time  { font-size: 11px; color: var(--t3); display: flex; align-items: center; gap: 3px; }
        .msg-subject  { font-weight: 600; color: var(--t1); margin-bottom: 4px; font-size: 13px; }
        .msg-preview  {
            color: var(--t3);
            font-size: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.55;
        }
        .sender-email { color: var(--t3); font-size: 12px; word-break: break-all; margin-bottom: 3px; }
        .sender-code  {
            display: inline-block;
            font-size: 11px;
            font-family: var(--mono);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 5px;
        }

        /* ── Status pill ── */
        .st-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: .2px;
        }
        .st-pill .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .st-unread { background: var(--amber-soft); color: #92400e; }
        .st-unread .dot { background: var(--amber); }
        .st-read   { background: var(--green-soft);  color: #166534; }
        .st-read   .dot { background: var(--green); }

        /* ── Buttons ── */
        .btn-ct {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font);
            border: none;
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
        }
        .btn-reply { background: var(--accent-soft); color: var(--accent); }
        .btn-reply:hover { background: #d8dffd; }
        .btn-read  { background: var(--green-soft); color: #166534; }
        .btn-read:hover { background: #bbf7d0; }
        .btn-del   { background: var(--red-soft); color: var(--red); }
        .btn-del:hover { background: #fecaca; }

        .ct-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

        .replied-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--green);
            font-weight: 600;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--t3);
        }
        .empty-state .bi {
            font-size: 44px;
            opacity: .3;
            display: block;
            margin-bottom: 12px;
        }
        .empty-state p { font-size: 14px; }

        /* ── No search results ── */
        #ct-no-results {
            display: none;
            text-align: center;
            padding: 44px 20px;
            color: var(--t3);
            font-size: 14px;
        }
        #ct-no-results .bi {
            font-size: 32px;
            opacity: .3;
            display: block;
            margin-bottom: 10px;
        }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.55);
            backdrop-filter: blur(3px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card);
            border-radius: 20px;
            width: 500px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(15,23,42,.25);
            overflow: hidden;
            animation: popIn .22s ease;
        }
        @keyframes popIn { from { opacity:0; transform: scale(.94) translateY(10px); } }
        .modal-header {
            padding: 22px 26px 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .modal-header h5 {
            font-size: 17px;
            font-weight: 700;
            color: var(--t1);
        }
        .modal-header h5 span { color: var(--accent); }
        .modal-close {
            background: var(--page);
            border: none;
            width: 30px; height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            color: var(--t3);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background .15s;
        }
        .modal-close:hover { background: var(--bdr); color: var(--t1); }
        .modal-body { padding: 18px 26px 26px; }
        .reply-textarea {
            width: 100%;
            height: 160px;
            padding: 13px 15px;
            border: 1px solid var(--bdr);
            border-radius: 12px;
            font-size: 14px;
            font-family: var(--font);
            color: var(--t1);
            resize: vertical;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            background: #fafbff;
        }
        .reply-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79,110,247,.1);
            background: var(--card);
        }
        .reply-textarea::placeholder { color: var(--t3); }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-cancel {
            background: var(--page);
            color: var(--t2);
            border: 1px solid var(--bdr);
        }
        .btn-cancel:hover { background: var(--bdr); }
        .btn-send {
            background: var(--accent);
            color: #fff;
        }
        .btn-send:hover { background: var(--accent-dark); }
    </style>
</head>
<body>
<div layout:fragment="content">

    <!-- Header -->
    <div class="page-header anim anim-1">
        <div>
            <div class="page-title">Tin nhắn liên hệ</div>
            <ol class="breadcrumb">
                <li><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                <li>Liên hệ</li>
            </ol>
        </div>
    </div>

    <!-- Flash -->
    <div th:if="${successMsg}" class="flash-success anim anim-1">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMsg}"></span>
    </div>

    <!-- Metrics -->
    <div class="metrics anim anim-2">
        <div class="metric-card blue">
            <div class="metric-icon blue"><i class="bi bi-envelope-fill"></i></div>
            <div>
                <div class="metric-val" th:text="${messages != null ? messages.size() : 0}">0</div>
                <div class="metric-lbl">Tổng tin nhắn</div>
            </div>
        </div>
        <div class="metric-card amber">
            <div class="metric-icon amber"><i class="bi bi-envelope-exclamation-fill"></i></div>
            <div>
                <div class="metric-val" th:text="${unreadCount != null ? unreadCount : 0}">0</div>
                <div class="metric-lbl">Chưa đọc</div>
            </div>
        </div>
    </div>

    <!-- Main card -->
    <div class="main-card anim anim-3">

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-title">
                <i class="bi bi-chat-left-text-fill"></i> Danh sách tin nhắn
            </div>
            <div class="search-wrap">
                <i class="bi bi-search"></i>
                <input type="text" id="ct-search-input" class="search-input"
                       placeholder="Tìm theo tên, email, chủ đề…" />
            </div>
        </div>

        <!-- Table -->
        <table class="ct-tbl">
            <colgroup>
                <col class="c-sender">
                <col class="c-subject">
                <col class="c-contact">
                <col class="c-status">
                <col class="c-reply">
                <col class="c-action">
            </colgroup>
            <thead>
                <tr>
                    <th>Người gửi</th>
                    <th>Chủ đề &amp; Nội dung</th>
                    <th>Email / MSSV</th>
                    <th>Trạng thái</th>
                    <th>Phản hồi</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="ct-tbody">

                <tr th:if="${messages == null or messages.isEmpty()}">
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>Chưa có tin nhắn nào.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="msg : ${messages}"
                    th:classappend="${msg.status.name() == 'UNREAD'} ? 'row-unread' : ''"
                    th:data-q="${#strings.toLowerCase(msg.fullName + ' ' + msg.subject + ' ' + msg.email + ' ' + (msg.studentCode ?: ''))}">

                    <!-- Người gửi -->
                    <td>
                        <div class="sender-name" th:text="${msg.fullName}"></div>
                        <div class="sender-time">
                            <i class="bi bi-clock"></i>
                            <span th:text="${#temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </td>

                    <!-- Chủ đề -->
                    <td>
                        <div class="msg-subject" th:text="${msg.subject}"></div>
                        <div class="msg-preview" th:text="${#strings.abbreviate(msg.message, 120)}"></div>
                    </td>

                    <!-- Email / MSSV -->
                    <td>
                        <div class="sender-email" th:text="${msg.email}"></div>
                        <span class="sender-code"
                              th:if="${msg.studentCode}"
                              th:text="${msg.studentCode}"></span>
                    </td>

                    <!-- Trạng thái -->
                    <td>
                        <span class="st-pill"
                              th:classappend="${msg.status.name() == 'UNREAD'} ? 'st-unread' : 'st-read'">
                            <span class="dot"></span>
                            <span th:text="${msg.status.name() == 'UNREAD'} ? 'Chưa đọc' : 'Đã phản hồi'"></span>
                        </span>
                    </td>

                    <!-- Phản hồi -->
                    <td>
                        <button th:if="${msg.status.name() != 'REPLIED'}"
                                class="btn-ct btn-reply"
                                th:attr="onclick='openModal(' + ${msg.id} + ', \'' + ${#strings.escapeJavaScript(msg.fullName)} + '\')'">
                            <i class="bi bi-reply-fill"></i> Phản hồi
                        </button>
                        <span th:if="${msg.status.name() == 'REPLIED'}" class="replied-badge">
                            <i class="bi bi-check-circle-fill"></i> Đã trả lời
                        </span>
                    </td>

                    <!-- Thao tác -->
                    <td>
                        <div class="ct-actions">
                            <form th:if="${msg.status.name() == 'UNREAD'}"
                                  th:action="@{/admin/contact/read/{id}(id=${msg.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn-ct btn-read" title="Đánh dấu đã đọc">
                                    <i class="bi bi-check-lg"></i> Đã đọc
                                </button>
                            </form>
                            <form th:action="@{/admin/contact/delete/{id}(id=${msg.id})}"
                                  method="post"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa tin nhắn này?')">
                                <button type="submit" class="btn-ct btn-del" title="Xóa">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div id="ct-no-results">
            <i class="bi bi-search"></i>
            Không tìm thấy kết quả phù hợp.
        </div>
    </div>

    <!-- Modal -->
    <div id="replyModal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h5>Gửi phản hồi cho <span id="senderName"></span></h5>
                <button class="modal-close" onclick="closeModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/contact/send-reply}" method="post">
                    <input type="hidden" name="messageId" id="messageId">
                    <textarea name="replyContent" required class="reply-textarea"
                              placeholder="Nhập nội dung phản hồi tại đây…"></textarea>
                    <div class="modal-footer">
                        <button type="button" class="btn-ct btn-cancel" onclick="closeModal()">
                            Hủy
                        </button>
                        <button type="submit" class="btn-ct btn-send">
                            <i class="bi bi-send-fill"></i> Gửi phản hồi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="script">
<script>
    function openModal(id, name) {
        if (!id) return;
        document.getElementById('messageId').value = id;
        document.getElementById('senderName').innerText = name || 'Khách';
        document.getElementById('replyModal').classList.add('active');
    }
    function closeModal() {
        document.getElementById('replyModal').classList.remove('active');
    }
    document.getElementById('replyModal').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
    });

    (function () {
        var input    = document.getElementById('ct-search-input');
        var rows     = document.querySelectorAll('#ct-tbody tr[data-q]');
        var noResult = document.getElementById('ct-no-results');
        if (!input) return;
        input.addEventListener('input', function () {
            var q = this.value.trim().toLowerCase();
            var visible = 0;
            rows.forEach(function (row) {
                var match = !q || (row.dataset.q || '').includes(q);
                row.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            if (noResult) noResult.style.display = (q && visible === 0) ? 'block' : 'none';
        });
    })();
</script>
</th:block>

</body>
</html>
