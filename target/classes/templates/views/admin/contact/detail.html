<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/admin_layout}" lang="vi">
<head>
    <title>Chi tiết hội thoại</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        .chat-wrapper { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; }
        .chat-header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .chat-messages { height: 450px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #f1f5f9; }
        .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 76%; }
        .msg-row.admin { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.user { align-self: flex-start; }
        .msg-avatar { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .msg-avatar.user { background: #e0e7ff; color: #4f46e5; }
        .msg-avatar.admin { background: #ede9fe; color: #7c3aed; }
        .msg-body { display: flex; flex-direction: column; }
        .msg-row.admin .msg-body { align-items: flex-end; }
        .msg-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; padding: 0 4px; }
        .msg-bubble { padding: 10px 15px; font-size: 14px; line-height: 1.5; }
        .msg-bubble.user { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px 16px 16px 4px; color: #1e293b; }
        .msg-bubble.admin { background: #4f46e5; border-radius: 16px 16px 4px 16px; color: #fff; }
        .msg-time { font-size: 10px; color: #94a3b8; margin-top: 4px; padding: 0 4px; }
        .chat-input-bar { padding: 14px 16px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: center; }
        .chat-input-bar input { flex: 1; border: 1px solid #cbd5e1; border-radius: 24px; padding: 10px 20px; font-size: 14px; outline: none; background: #f8fafc; }
        .chat-send-btn { width: 42px; height: 42px; border-radius: 50%; background: #4f46e5; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="main-card p-6">
        <div class="chat-wrapper shadow-sm">
            <div class="chat-header">
                <div class="d-flex align-items-center gap-2">
                    <div class="msg-avatar user"><i class="ti ti-user"></i></div>
                    <div>
                        <div class="fw-bold" th:text="${contact.fullName}"></div>
                        <div style="font-size:12px; color:#64748b;" th:text="${contact.email}"></div>
                    </div>
                </div>
                <a href="/admin/contact/list" class="btn btn-sm btn-outline-secondary">
                    <i class="ti ti-arrow-left"></i> Quay lại
                </a>
            </div>

            <div class="chat-messages" id="message-container">
                <div class="msg-row user">
                    <div class="msg-avatar user"><i class="ti ti-user"></i></div>
                    <div class="msg-body">
                        <div class="msg-label" th:text="${contact.fullName}"></div>
                        <div class="msg-bubble user" th:text="${contact.message}"></div>
                        <div class="msg-time" th:text="${#temporals.format(contact.createdAt, 'HH:mm')}"></div>
                    </div>
                </div>

                <div th:each="msg : ${messages}"
                     th:class="${'msg-row ' + (msg.senderRole == 'ADMIN' ? 'admin' : 'user')}">
                    <div th:class="${'msg-avatar ' + (msg.senderRole == 'ADMIN' ? 'admin' : 'user')}">
                        <i th:class="${msg.senderRole == 'ADMIN' ? 'ti ti-shield-check' : 'ti ti-user'}"></i>
                    </div>
                    <div class="msg-body">
                        <div class="msg-label" th:text="${msg.senderRole == 'ADMIN' ? 'Admin' : contact.fullName}"></div>
                        <div th:class="${'msg-bubble ' + (msg.senderRole == 'ADMIN' ? 'admin' : 'user')}"
                             th:text="${msg.content}"></div>
                        <div class="msg-time" th:text="${#temporals.format(msg.createdAt, 'HH:mm')}"></div>
                    </div>
                </div>
            </div>

            <form th:action="@{/admin/contact/send-reply}" method="post" class="chat-input-bar">
                <input type="hidden" name="messageId" th:value="${contact.id}">
                <input type="text" name="replyContent" required placeholder="Nhập tin nhắn phản hồi..." autocomplete="off">
                <button type="submit" class="chat-send-btn">
                    <i class="ti ti-send"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const container = document.getElementById('message-container');
        container.scrollTop = container.scrollHeight;
    </script>
</div>
</body>
</html>
