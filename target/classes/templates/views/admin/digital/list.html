<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}" lang="vi">
<head>
    <title>Quản lý Tài liệu số</title>
    <th:block layout:fragment="css">
    <style>
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .42s cubic-bezier(.4,0,.2,1) both}
.anim-1{animation-delay:.05s}.anim-2{animation-delay:.10s}.anim-3{animation-delay:.15s}

.bk-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.bk-title{font-family:var(--fh);font-size:23px;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.bk-breadcrumb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--t3);margin-top:4px;list-style:none;padding:0;margin:0}
.bk-breadcrumb a{color:var(--t2);text-decoration:none;transition:color .14s}
.bk-breadcrumb a:hover{color:var(--ac)}
.bk-breadcrumb li:not(:last-child)::after{content:'/';margin-left:5px;color:var(--bdr)}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.m-tile{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shd);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:default}
.m-tile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--mc,var(--ac));transform:scaleX(0);transform-origin:left;transition:transform .28s}
.m-tile:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(17,24,39,.10)}
.m-tile:hover::after{transform:scaleX(1)}
.m-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--mic,var(--ca-bg));color:var(--mc,var(--ca))}
.m-val{font-family:var(--fh);font-size:28px;font-weight:800;color:var(--t1);line-height:1}
.m-lbl{font-size:12px;color:var(--t2);margin-top:4px;font-weight:500}
.m-ghost{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-size:54px;opacity:.04;pointer-events:none}

.bk-wrap{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--shd)}
.bk-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--bdr)}
.bk-search{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--page);transition:all .18s;width:280px}
.bk-search:focus-within{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac-bg)}
.bk-search i{color:var(--t3);font-size:14px;flex-shrink:0}
.bk-search input{border:none;background:transparent;outline:none;font-family:var(--fb);font-size:13.5px;color:var(--t1);width:100%}
.tb-btn{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--page);font-family:var(--fb);font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s}
.tb-btn:hover{background:var(--card);border-color:#c4cdd8;color:var(--t1)}
.ml-a{margin-left:auto}
.res-txt{font-size:12.5px;color:var(--t3)}
.res-txt b{color:var(--t2)}

.bk-tbl{width:100%;border-collapse:collapse}
.bk-tbl thead th{background:var(--page);padding:11px 18px;font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--bdr);white-space:nowrap}
.bk-tbl tbody tr{border-bottom:1px solid #f0f4fb;transition:background .12s}
.bk-tbl tbody tr:last-child{border-bottom:none}
.bk-tbl tbody tr:hover{background:#f7f9ff}
.bk-tbl td{padding:13px 18px;vertical-align:middle}

.doc-ic{width:44px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.doc-nm{font-family:var(--fh);font-size:13.5px;font-weight:700;color:var(--t1);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:260px}
.doc-sub{font-size:12px;color:var(--t3);margin-top:3px}

.type-chip{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.type-giaotrinh{background:#eff6ff;color:#1d4ed8}
.type-luanvan{background:#f0fdf4;color:#15803d}
.type-nckh{background:#fefce8;color:#854d0e}
.type-dethi{background:#fdf4ff;color:#7e22ce}
.type-baobao{background:#fff7ed;color:#c2410c}
.type-other{background:#f1f5f9;color:#475569}

.act-g{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.ai{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;font-size:14px;text-decoration:none;transition:all .15s;border:none;cursor:pointer}
.ai-edit{background:#eff6ff;color:#2563eb}
.ai-edit:hover{background:#dbeafe;color:#1d4ed8}
.ai-del{background:#fef2f2;color:#dc2626}
.ai-del:hover{background:#fee2e2;color:#b91c1c}

.bk-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--page);border-top:1px solid var(--bdr)}
.bk-foot-t{font-size:12.5px;color:var(--t3)}
.bk-foot-t b{color:var(--t2)}

.bk-alert{display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:12px;margin-bottom:20px;font-size:13.5px;background:var(--cg-bg);color:#065f46;border:1px solid rgba(16,185,129,.2)}
.bk-alert i{font-size:17px;flex-shrink:0}
.bk-ac{margin-left:auto;background:none;border:none;cursor:pointer;opacity:.55;font-size:14px;color:inherit}
.bk-ac:hover{opacity:1}

@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}}
    </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">

    <div class="bk-head anim anim-1">
        <div>
            <div class="bk-title">Tài liệu số</div>
            <ol class="bk-breadcrumb">
                <li><a th:href="@{/admin/dashboard}"><i class="bi bi-house-door"></i> Trang chủ</a></li>
                <li class="active">Quản lý Tài liệu số</li>
            </ol>
        </div>
        <a th:href="@{/admin/digital/add}" class="btn-p">
            <i class="bi bi-plus-lg"></i> Thêm tài liệu mới
        </a>
    </div>

    <div th:if="${successMsg}" class="bk-alert anim anim-1">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMsg}"></span>
        <button class="bk-ac" onclick="this.closest('.bk-alert').remove()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <!-- Metrics -->
    <div class="metrics anim anim-2">
        <div class="m-tile" style="--mc:var(--ac);--mic:var(--ac-bg)">
            <div class="m-ic"><i class="bi bi-file-earmark-text"></i></div>
            <div>
                <div class="m-val" th:text="${documents.size()}">0</div>
                <div class="m-lbl">Tổng tài liệu</div>
            </div>
            <div class="m-ghost" style="color:var(--ac)"><i class="bi bi-file-earmark-text"></i></div>
        </div>
        <div class="m-tile" style="--mc:#1d4ed8;--mic:#eff6ff">
            <div class="m-ic"><i class="bi bi-book"></i></div>
            <div>
                <div class="m-val" th:text="${documents.?[type == 'giaotrinh'].size()}">0</div>
                <div class="m-lbl">Giáo trình</div>
            </div>
            <div class="m-ghost" style="color:#1d4ed8"><i class="bi bi-book"></i></div>
        </div>
        <div class="m-tile" style="--mc:#15803d;--mic:#f0fdf4">
            <div class="m-ic"><i class="bi bi-mortarboard"></i></div>
            <div>
                <div class="m-val" th:text="${documents.?[type == 'luanvan'].size()}">0</div>
                <div class="m-lbl">Luận văn</div>
            </div>
            <div class="m-ghost" style="color:#15803d"><i class="bi bi-mortarboard"></i></div>
        </div>
        <div class="m-tile" style="--mc:#854d0e;--mic:#fefce8">
            <div class="m-ic"><i class="bi bi-search"></i></div>
            <div>
                <div class="m-val" th:text="${documents.?[type == 'nckh'].size()}">0</div>
                <div class="m-lbl">Đề tài NCKH</div>
            </div>
            <div class="m-ghost" style="color:#854d0e"><i class="bi bi-search"></i></div>
        </div>
    </div>

    <div class="bk-wrap anim anim-3">
        <div class="bk-toolbar">
            <div class="bk-search">
                <i class="bi bi-search"></i>
                <input type="text" id="docSearch" placeholder="Tìm tên tài liệu, tác giả...">
            </div>
            <!-- Filter by type -->
            <form th:action="@{/admin/digital/list}" method="get" style="display:contents">
                <select name="type" class="tb-btn" onchange="this.form.submit()"
                        style="height:40px;padding:0 12px;cursor:pointer">
                    <option value="">Tất cả loại</option>
                    <option value="giaotrinh" th:selected="${selectedType == 'giaotrinh'}">📖 Giáo trình</option>
                    <option value="luanvan"   th:selected="${selectedType == 'luanvan'}">🎓 Luận văn</option>
                    <option value="nckh"      th:selected="${selectedType == 'nckh'}">🔬 NCKH</option>
                    <option value="dethi"     th:selected="${selectedType == 'dethi'}">📝 Đề thi</option>
                    <option value="baobao"    th:selected="${selectedType == 'baobao'}">📊 Báo cáo</option>
                </select>
            </form>
            <div class="ml-a">
                <span class="res-txt">Tổng <b id="visibleCount" th:text="${documents.size()}">0</b> tài liệu</span>
            </div>
        </div>

        <table class="bk-tbl">
            <thead>
                <tr>
                    <th style="padding-left:22px">Tài liệu</th>
                    <th>Tác giả</th>
                    <th>Loại</th>
                    <th>Năm</th>
					<th>Tệp tin</th>
                    <th class="text-end" style="padding-right:22px">Thao tác</th>
                </tr>
            </thead>
            <tbody id="docTable">
                <tr th:each="doc : ${documents}">
                    <td style="padding-left:22px">
                        <div style="display:flex;align-items:center;gap:12px">
                            <div class="doc-ic"
                                 th:style="${doc.type == 'giaotrinh' ? 'background:linear-gradient(135deg,#eff6ff,#dbeafe)' :
                                            doc.type == 'luanvan'   ? 'background:linear-gradient(135deg,#f0fdf4,#dcfce7)' :
                                            doc.type == 'nckh'      ? 'background:linear-gradient(135deg,#fefce8,#fef3c7)' :
                                            doc.type == 'dethi'     ? 'background:linear-gradient(135deg,#fdf4ff,#f3e8ff)' :
                                            'background:linear-gradient(135deg,#fff7ed,#ffedd5)'}">
                                <span th:text="${doc.type == 'giaotrinh' ? '📖' :
                                               doc.type == 'luanvan'   ? '🎓' :
                                               doc.type == 'nckh'      ? '🔬' :
                                               doc.type == 'dethi'     ? '📝' : '📄'}">📄</span>
                            </div>
                            <div>
                                <div class="doc-nm" th:text="${doc.title}">Tên tài liệu</div>
                                <div class="doc-sub" th:if="${doc.category != null}"
                                     th:text="${doc.category}">Danh mục</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span style="font-size:13px;color:var(--t2)"
                              th:text="${doc.author ?: '—'}">Tác giả</span>
                    </td>
                    <td>
                        <span class="type-chip"
                              th:classappend="${'type-' + (doc.type ?: 'other')}"
                              th:text="${doc.type == 'giaotrinh' ? '📖 Giáo trình' :
                                        doc.type == 'luanvan'   ? '🎓 Luận văn'   :
                                        doc.type == 'nckh'      ? '🔬 NCKH'        :
                                        doc.type == 'dethi'     ? '📝 Đề thi'      :
                                        doc.type == 'baobao'    ? '📊 Báo cáo'     : '📄 Khác'}">
                        </span>
                    </td>
                    <td style="font-size:13px;color:var(--t2)" th:text="${doc.year ?: '—'}"></td>
					<td style="text-align:center">
					    <a th:if="${doc.fileUrl != null and doc.fileUrl != ''}" 
					       th:href="@{${doc.fileUrl}}" 
					       target="_blank" 
					       class="ai" style="background:#eff6ff;color:#2563eb" title="Xem file">
					        <i class="bi bi-file-earmark-pdf"></i>
					    </a>
					    <span th:if="${doc.fileUrl == null or doc.fileUrl == ''}" class="text-muted" style="font-size:12px">
					        Chưa có
					    </span>
					</td>
                    <td style="padding-right:22px">
                        <div class="act-g">
                            <a th:href="@{/admin/digital/edit/{id}(id=${doc.id})}"
                               class="ai ai-edit" title="Chỉnh sửa">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/digital/delete/{id}(id=${doc.id})}"
                                  method="post" style="margin:0"
                                  onsubmit="return confirm('Xóa tài liệu này?')">
                                <button type="submit" class="ai ai-del" title="Xóa">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- Empty -->
                <tr th:if="${#lists.isEmpty(documents)}">
                    <td colspan="7" style="text-align:center;padding:64px">
                        <i class="bi bi-file-earmark-x"
                           style="font-size:40px;color:var(--t3);display:block;margin-bottom:12px"></i>
                        <div style="color:var(--t3);font-size:14px;font-weight:500">
                            Chưa có tài liệu nào
                        </div>
                        <a th:href="@{/admin/digital/add}"
                           class="btn-p" style="margin-top:16px;display:inline-flex">
                            <i class="bi bi-plus-lg"></i> Thêm tài liệu đầu tiên
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="bk-foot">
            <span class="bk-foot-t">
                Hiển thị <b id="footCount" th:text="${documents.size()}">0</b>
                / <b th:text="${documents.size()}">0</b> tài liệu
            </span>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
	<script>
	    const inp = document.getElementById('docSearch');
	    const vc  = document.getElementById('visibleCount');
	    const fc  = document.getElementById('footCount');

	    inp.addEventListener('input', function () {
	        const q = this.value.toLowerCase().trim();
	        let cnt = 0;
	        
	        // Lấy tất cả các dòng trong tbody, trừ dòng thông báo Empty
	        const rows = document.querySelectorAll('#docTable tr');
	        
	        rows.forEach(row => {
	            // Bỏ qua dòng hiển thị "Chưa có tài liệu nào"
	            if (row.querySelector('td[colspan]')) return; 

	            const title = row.querySelector('.doc-nm')?.textContent.toLowerCase() || '';
	            const author = row.cells[1]?.textContent.toLowerCase() || '';
	            
	            const isVisible = title.includes(q) || author.includes(q);
	            row.style.display = isVisible ? '' : 'none';
	            
	            if (isVisible) cnt++;
	        });

	        // Cập nhật lại số lượng hiển thị trên UI
	        vc.textContent = cnt;
	        fc.textContent = cnt;
	    });
	</script>
</th:block>
</body>
</html>
