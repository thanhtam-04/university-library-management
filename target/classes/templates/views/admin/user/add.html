<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}">
<head>
    <title>Thêm tài khoản mới</title>
    <style>
        .form-card { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: none; }
        .role-checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 10px; }
        .btn-save { background: #4154f1; color: #fff; border-radius: 8px; padding: 10px 25px; font-weight: 600; }
        .btn-save:hover { background: #2f43e0; color: #fff; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pagetitle">
        <h1 style="color: #012970; font-weight: 700;">Thêm tài khoản</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/users}">Tài khoản</a></li>
                <li class="breadcrumb-item active">Thêm mới</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card">
                    <!-- Thông báo lỗi nếu có -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-octagon me-1"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/admin/users/add}" th:object="${user}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên đăng nhập (Username)</label>
                                <input type="text" th:field="*{username}" class="form-control" required placeholder="Ví dụ: nhipham">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Mật khẩu</label>
                                <input type="password" th:field="*{password}" class="form-control" required placeholder="Nhập mật khẩu">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Họ và tên</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required placeholder="Nhập họ tên đầy đủ">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="example@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="0123 456 789">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Phân quyền tài khoản</label>
                                <div class="role-checkbox-group">
                                    <div th:each="role : ${allRoles}" class="form-check me-3">
                                        <input class="form-check-input" type="checkbox" name="roleIds" 
                                               th:value="${role.id}" th:id="'role' + ${role.id}">
                                        <label class="form-check-label" th:for="'role' + ${role.id}"
                                               th:text="${role.name == T(thuvien.entity.Role.RoleName).ROLE_ADMIN ? 'Quản trị viên' : 
                                                        (role.name == T(thuvien.entity.Role.RoleName).ROLE_LIBRARIAN ? 'Thủ thư' : 'Sinh viên')}">
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 text-end mt-4">
                                <a th:href="@{/admin/users}" class="btn btn-secondary rounded-8 px-4 me-2">Hủy bỏ</a>
                                <button type="submit" class="btn btn-save">Lưu tài khoản</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
