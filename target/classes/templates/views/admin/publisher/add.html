<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}"
      lang="vi">
<head>
    <title>Thêm Nhà Xuất Bản</title>
    <th:block layout:fragment="css">
        <style>
            /* Style đồng bộ hoàn toàn với trang Sách của Nhi */
            .form-card { 
                background: #fff; border-radius: 15px; padding: 30px; 
                box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: none; 
            }
            .form-label { 
                font-weight: 600; color: #012970; 
                margin-bottom: 8px; font-size: 14px; 
            }
            .form-control { 
                border-radius: 10px; padding: 12px 15px; border: 1px solid #ced4da; 
                font-size: 14px; transition: all 0.2s; 
            }
            .form-control:focus { 
                border-color: #4154f1; box-shadow: 0 0 0 4px rgba(65, 84, 241, 0.1); 
            }
            .section-title { 
                font-size: 16px; font-weight: 700; color: #4154f1; 
                margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f6f9ff;
                display: flex; align-items: center; gap: 10px;
            }
            .btn-save { 
                background: #4154f1; color: #fff; border: none; padding: 12px 30px; 
                border-radius: 10px; font-weight: 600; transition: all 0.3s;
            }
            .btn-save:hover { 
                background: #2f43e0; transform: translateY(-2px); 
                box-shadow: 0 5px 15px rgba(65, 84, 241, 0.3); color: #fff; 
            }
            .btn-back { 
                background: #f8f9fa; color: #6c757d; border-radius: 10px; 
                padding: 12px 20px; font-weight: 600; text-decoration: none; 
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="pagetitle">
        <h1 style="color: #012970; font-weight: 700;">Thêm Nhà Xuất Bản Mới</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/publisher/list}">Nhà xuất bản</a></li>
                <li class="breadcrumb-item active">Thêm mới</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <form th:action="@{/admin/publisher/save}" th:object="${publisher}" method="post">
            <div class="form-card">
                
                <!-- 1. Thông tin định danh (Dàn ngang giống hàng 1 của Sách) -->
                <div class="section-title">
                    <i class="bi bi-building"></i> Thông tin cơ bản
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-8">
                        <label class="form-label">Tên Nhà xuất bản</label>
                        <input type="text" th:field="*{name}" class="form-control" 
                               placeholder="Nhập tên nhà xuất bản..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Website</label>
                        <input type="url" th:field="*{website}" class="form-control" 
                               placeholder="https://www.nxb.vn">
                    </div>
                </div>

                <!-- 2. Thông tin liên lạc (Dàn ngang 3 cột như hàng Kho của Sách) -->
                <div class="section-title">
                    <i class="bi bi-telephone-outbound"></i> Liên hệ & Địa chỉ
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" th:field="*{phone}" class="form-control" 
                               placeholder="0243.xxx.xxx">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" 
                               placeholder="contact@nxb.vn">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Địa chỉ trụ sở</label>
                        <input type="text" th:field="*{address}" class="form-control" 
                               placeholder="Số nhà, tên đường...">
                    </div>
                </div>

                <!-- Footer nút bấm dàn 2 bên cực rộng -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/publisher/list}" class="btn-back">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn-save">
                        <i class="bi bi-check-lg"></i> Lưu Nhà xuất bản
                    </button>
                </div>
            </div>
        </form>
    </section>
</div>
</body>
</html>
