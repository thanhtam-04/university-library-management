<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin_layout}"
      lang="vi">
<head>
    <title>Tạo Phiếu Mượn</title>
    <th:block layout:fragment="css">
        <style>
            /* Style chuẩn đồng bộ với trang Sách của Nhi */
            .form-card { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: none; }
            .form-label { font-weight: 600; color: #012970; margin-bottom: 8px; font-size: 14px; }
            .form-control, .form-select { 
                border-radius: 10px; padding: 12px 15px; border: 1px solid #ced4da; 
                font-size: 14px; transition: all 0.2s; 
            }
            .form-control:focus, .form-select:focus { 
                border-color: #4154f1; box-shadow: 0 0 0 4px rgba(65, 84, 241, 0.1); 
            }
            
            /* Section title phong cách Blue */
            .section-title { 
                font-size: 16px; font-weight: 700; color: #4154f1; 
                margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f6f9ff;
                display: flex; align-items: center; gap: 10px;
            }

            /* Danh sách bản sao sách */
            .copy-list { 
                max-height: 350px; overflow-y: auto; 
                border: 1px solid #f1f5f9; border-radius: 12px;
                background: #fcfdfe;
            }
            .copy-item { 
                display: flex; align-items: center; gap: 15px; 
                padding: 12px 20px; border-bottom: 1px solid #f1f5f9; 
                transition: all 0.2s; cursor: pointer; 
            }
            .copy-item:hover { background: #f0f7ff; }
            .copy-barcode { font-family: 'Monaco', monospace; font-weight: 700; color: #4154f1; }
            .copy-book { font-weight: 500; color: #475569; }
            .copy-status { 
                font-size: 11px; background: #dcfce7; color: #16a34a; 
                border-radius: 20px; padding: 3px 12px; font-weight: 700;
            }

            /* Nút bấm chuẩn Blue */
            .btn-save { 
                background: #4154f1; color: #fff; border: none; padding: 12px 30px; 
                border-radius: 10px; font-weight: 600; transition: all 0.3s;
            }
            .btn-save:hover { background: #2f43e0; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(65, 84, 241, 0.3); color: #fff; }
            .btn-back { background: #f8f9fa; color: #6c757d; border-radius: 10px; padding: 12px 20px; font-weight: 600; text-decoration: none; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="pagetitle">
        <h1 style="color: #012970; font-weight: 700;">Tạo Phiếu Mượn Mới</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/loan/list}">Quản lý mượn trả</a></li>
                <li class="breadcrumb-item active">Tạo phiếu</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <form th:action="@{/admin/loan/save}" th:object="${loan}" method="post">
            <div class="form-card">
                
                <!-- 1. Đối tượng mượn -->
                <div class="section-title">
                    <i class="bi bi-people-fill"></i> Thông tin đối tượng
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Thành viên mượn <span class="text-danger">*</span></label>
                        <select name="memberId" class="form-select" required>
                            <option value="">-- Chọn thành viên (Tên - Mã thẻ) --</option>
                            <option th:each="m : ${members}" th:value="${m.id}"
                                    th:text="${(m.user != null ? m.user.fullName : '?') + ' · ' + m.cardNumber}">
                            </option>
                        </select>
                    </div>
                    
                </div>

                <!-- 2. Mã & Thời hạn -->
                <div class="section-title">
                    <i class="bi bi-calendar-check-fill"></i> Mã phiếu & Thời hạn
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Mã phiếu mượn <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{loanCode}" class="form-control" placeholder="PM-2026-XXX" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Hạn trả sách <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{dueDate}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tiền cọc thế chân (VNĐ)</label>
                        <input type="number" th:field="*{depositPaid}" class="form-control" placeholder="0">
                    </div>
                </div>

                <!-- 3. Chọn sách -->
                <div class="section-title">
                    <i class="bi bi-book-half"></i> Danh sách bản sao sẵn sàng
                </div>
                
                <div class="mb-3">
                    <div class="input-group" style="max-width: 450px;">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-primary"></i></span>
                        <input type="text" id="copySearch" class="form-control border-start-0" placeholder="Tìm theo mã vạch hoặc tên sách...">
                    </div>
                </div>
                
                <div class="copy-list mb-3" id="copyList">
                    <div th:each="c : ${copies}" class="copy-item">
                        <input type="checkbox" name="copyIds" th:value="${c.id}" th:id="${'copy_' + c.id}" class="form-check-input">
                        <label th:for="${'copy_' + c.id}" class="d-flex align-items-center flex-grow-1 m-0">
                            <span class="copy-barcode me-4" th:text="${c.barcode}"></span>
                            <span class="copy-book" th:text="${c.book != null ? c.book.title : '—'}"></span>
                            <span class="ms-auto copy-status">Sẵn sàng</span>
                        </label>
                    </div>
                </div>
                
                <div class="selected-count mb-4" id="selectedCount" style="color: #4154f1; font-weight: 700; font-size: 14px;">
                    <i class="bi bi-info-circle"></i> Đã chọn: 0 cuốn
                </div>

                <!-- 4. Ghi chú -->
                <div class="mb-4">
                    <label class="form-label">Ghi chú phiếu mượn</label>
                    <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Nhập ghi chú thêm nếu có..."></textarea>
                </div>

                <!-- Footer nút bấm -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/loan/list}" class="btn-back">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn-save">
                        <i class="bi bi-check-lg"></i> Hoàn tất tạo phiếu
                    </button>
                </div>
            </div>
        </form>
    </section>
</div>

<th:block layout:fragment="script">
    <script>
        // Đồng bộ logic đếm và tìm kiếm
        const checkboxes = document.querySelectorAll('input[name="copyIds"]');
        const selectedCount = document.getElementById('selectedCount');

        function updateCount() {
            const n = document.querySelectorAll('input[name="copyIds"]:checked').length;
            selectedCount.innerHTML = `<i class="bi bi-info-circle"></i> Đã chọn: ${n} cuốn sách`;
        }
        checkboxes.forEach(cb => cb.addEventListener('change', updateCount));

        document.getElementById('copySearch').addEventListener('input', function () {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.copy-item').forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(q) ? 'flex' : 'none';
            });
        });
    </script>
</th:block>
</body>
</html>
